<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deathbat Player - Music & Favorites</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@300;400;700&display=swap');
        body { background: #050505; font-family: 'Inter', sans-serif; overflow: hidden; color: #d4d4d8; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        #particles-js { position: fixed; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .glass { background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.03); }
        .active-song { background: linear-gradient(90deg, rgba(239, 68, 68, 0.1) 0%, transparent 100%); border-left: 4px solid #ef4444; color: white; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        .tab-active { color: #ef4444; border-bottom: 2px solid #ef4444; }

        /* PERBAIKAN SCROLL MOBILE */
        @media (max-width: 768px) {
            #playlistContainer {
                max-height: 45vh; /* Batasi tinggi agar tidak menutupi player */
                overflow-y: auto !important;
                -webkit-overflow-scrolling: touch; /* Scroll halus iOS */
            }
        }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="relative z-10 flex flex-col md:flex-row h-screen">
        
        <!-- SIDEBAR -->
        <div class="w-full md:w-96 glass flex flex-col border-r border-white/5 overflow-hidden">
            <!-- Bagian Atas Sidebar (Tetap diam) -->
            <div class="p-6 flex-none">
                <div class="mb-6">
                    <h1 class="text-2xl font-orbitron font-black text-red-600 tracking-tighter">DEATHBAT</h1>
                    <p class="text-[10px] text-zinc-500 tracking-[0.3em] font-bold">COMMUNITY PLAYER</p>
                </div>

                <!-- SEARCH -->
                <div class="relative mb-6">
                    <i class="fas fa-search absolute left-4 top-3.5 text-zinc-600 text-sm"></i>
                    <input type="text" id="searchInput" oninput="searchMusic()" placeholder="Cari lagu..." 
                           class="w-full bg-zinc-900/50 border border-zinc-800 rounded-xl py-3 pl-12 pr-4 text-sm focus:outline-none focus:border-red-600 transition">
                </div>

                <!-- TABS -->
                <div class="flex space-x-6 text-xs font-bold uppercase tracking-widest mb-4 border-b border-zinc-800">
                    <button onclick="switchTab('all')" id="tab-all" class="pb-2 tab-active transition">Semua</button>
                    <button onclick="switchTab('fav')" id="tab-fav" class="pb-2 text-zinc-500 hover:text-white transition">Favorit Saya</button>
                </div>
            </div>

            <!-- AREA LIST (Bisa di-scroll) -->
            <div class="flex-1 overflow-y-auto px-2 pb-32" id="playlistContainer">
                <!-- Content via JS -->
            </div>
        </div>

        <!-- MAIN DISPLAY -->
        <div class="flex-1 flex flex-col p-6 items-center justify-center">
            <div class="text-center max-w-md w-full">
                <div class="relative inline-block mb-10 group">
                    <div class="absolute -inset-10 bg-red-600 rounded-full blur-[100px] opacity-10 group-hover:opacity-20 transition duration-1000"></div>
                    <img id="diskCover" src="https://raw.githubusercontent.com/a7x-Fanbase-blitar/a7x-countdown-live-JIS/main/a7xblitar.png" 
                         class="relative w-48 h-48 md:w-80 md:h-80 rounded-full object-cover border-[12px] border-zinc-900 shadow-2xl animate-[spin_15s_linear_infinite] [animation-play-state:paused]">
                </div>
                
                <h2 id="songTitle" class="text-2xl md:text-5xl font-black mb-2 text-white truncate font-orbitron uppercase tracking-tighter">Ready?</h2>
                <p id="songArtist" class="text-red-500 font-bold tracking-[0.5em] text-xs uppercase">Avenged Sevenfold</p>
                
                <div class="mt-8">
                    <button id="favBtnMain" onclick="toggleFavoriteCurrent()" class="text-2xl hover:scale-110 transition">
                        <i class="far fa-heart"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- PLAYER BAR -->
    <div class="fixed bottom-0 left-0 right-0 glass border-t border-white/5 p-6 z-50">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center gap-6">
            
            <div class="hidden md:flex items-center w-1/4">
                <img id="miniCover" src="https://raw.githubusercontent.com/a7x-Fanbase-blitar/a7x-countdown-live-JIS/main/a7xblitar.png" class="w-12 h-12 rounded-lg mr-4">
                <div class="truncate">
                    <p id="miniTitle" class="text-sm font-bold text-white truncate">Pilih Lagu</p>
                    <p class="text-[10px] text-zinc-500 font-bold uppercase">Now Playing</p>
                </div>
            </div>

            <div class="flex-1 w-full flex flex-col items-center">
                <div class="flex items-center space-x-8 mb-4">
                    <button onclick="prev()" class="text-zinc-500 hover:text-white transition"><i class="fas fa-step-backward text-xl"></i></button>
                    <button onclick="togglePlay()" class="bg-red-600 text-white w-14 h-14 rounded-full flex items-center justify-center hover:scale-110 transition shadow-lg shadow-red-900/40">
                        <i id="playIcon" class="fas fa-play ml-1 text-xl"></i>
                    </button>
                    <button onclick="next()" class="text-zinc-500 hover:text-white transition"><i class="fas fa-step-forward text-xl"></i></button>
                </div>
                <div class="w-full flex items-center space-x-3 text-[10px] font-bold text-zinc-600">
                    <span id="currentTime">0:00</span>
                    <input type="range" id="progressBar" value="0" class="flex-1 h-1 bg-zinc-800 appearance-none rounded-full accent-red-600 outline-none cursor-pointer">
                    <span id="durationTime">0:00</span>
                </div>
            </div>

            <div class="hidden md:flex items-center justify-end w-1/4 space-x-3">
                <i class="fas fa-volume-down text-zinc-600"></i>
                <input type="range" id="volumeSlider" min="0" max="100" value="80" class="w-24 h-1 bg-zinc-800 appearance-none rounded-full accent-red-600">
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const GITHUB_USER = "a7x-Fanbase-blitar";
        const GITHUB_REPO = "aset-music";
        
        let allSongs = [];
        let currentPlaylist = [];
        let favorites = JSON.parse(localStorage.getItem('a7x_favs')) || [];
        let currentIndex = 0;
        let currentTab = 'all';

        const player = document.getElementById('audioPlayer');
        const playIcon = document.getElementById('playIcon');
        const disk = document.getElementById('diskCover');

        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 50 },
                "color": { "value": "#ef4444" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.2 },
                "size": { "value": 2 },
                "move": { "enable": true, "speed": 1, "direction": "top" }
            }
        });

        async function fetchMusic() {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`);
                const files = await response.json();
                
                if (Array.isArray(files)) {
                    allSongs = files
                        .filter(f => f.name.toLowerCase().endsWith('.mp3'))
                        .map(f => ({
                            id: f.sha,
                            name: f.name,
                            title: f.name.replace('.mp3', '').replace(/_/g, ' ').replace(/-/g, ' '),
                            url: `https://cdn.jsdelivr.net/gh/${GITHUB_USER}/${GITHUB_REPO}/${f.name}`
                        }));
                    currentPlaylist = [...allSongs];
                    renderPlaylist();
                    if(allSongs.length > 0) loadSong(0, false);
                }
            } catch (e) { console.error(e); }
        }

        function renderPlaylist() {
            const container = document.getElementById('playlistContainer');
            const list = currentTab === 'all' ? currentPlaylist : allSongs.filter(s => favorites.includes(s.id));
            
            if(list.length === 0) {
                container.innerHTML = `<p class="text-center text-zinc-600 mt-10 text-xs uppercase tracking-widest">Tidak ada lagu</p>`;
                return;
            }

            container.innerHTML = list.map((song, i) => {
                const isFav = favorites.includes(song.id);
                const isActive = player.src === song.url;
                return `
                    <div class="group flex items-center p-4 rounded-2xl cursor-pointer transition hover:bg-white/5 ${isActive ? 'active-song' : ''}">
                        <div onclick="selectSong('${song.url}')" class="flex-1 flex items-center overflow-hidden">
                            <div class="w-8 h-8 flex items-center justify-center rounded bg-zinc-900 mr-4">
                                <i class="fas ${isActive ? 'fa-volume-up text-red-500' : 'fa-music text-zinc-700'} text-xs"></i>
                            </div>
                            <div class="truncate">
                                <p class="text-sm font-bold truncate">${song.title}</p>
                                <p class="text-[9px] text-zinc-600 font-bold uppercase tracking-tighter">A7X Asset</p>
                            </div>
                        </div>
                        <button onclick="toggleFavorite('${song.id}')" class="ml-2 ${isFav ? 'text-red-500' : 'text-zinc-700 hover:text-white'} transition">
                            <i class="${isFav ? 'fas' : 'far'} fa-heart"></i>
                        </button>
                    </div>
                `;
            }).join('');
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-all').className = tab === 'all' ? 'pb-2 tab-active transition' : 'pb-2 text-zinc-500 hover:text-white transition';
            document.getElementById('tab-fav').className = tab === 'fav' ? 'pb-2 tab-active transition' : 'pb-2 text-zinc-500 hover:text-white transition';
            renderPlaylist();
        }

        function selectSong(url) {
            const idx = allSongs.findIndex(s => s.url === url);
            loadSong(idx, true);
        }

        function loadSong(i, autostart) {
            currentIndex = i;
            const song = allSongs[i];
            player.src = song.url;
            document.getElementById('songTitle').innerText = song.title;
            document.getElementById('miniTitle').innerText = song.title;
            updateFavBtnStatus(song.id);
            renderPlaylist();
            if(autostart) play();
        }

        function toggleFavorite(id) {
            if(favorites.includes(id)) { favorites = favorites.filter(f => f !== id); } 
            else { favorites.push(id); }
            localStorage.setItem('a7x_favs', JSON.stringify(favorites));
            renderPlaylist();
            updateFavBtnStatus(allSongs[currentIndex].id);
        }

        function toggleFavoriteCurrent() { toggleFavorite(allSongs[currentIndex].id); }

        function updateFavBtnStatus(id) {
            const isFav = favorites.includes(id);
            document.getElementById('favBtnMain').className = isFav ? 'text-2xl text-red-500 scale-110 transition' : 'text-2xl text-zinc-700 hover:text-white transition';
            document.getElementById('favBtnMain').innerHTML = `<i class="${isFav ? 'fas' : 'far'} fa-heart"></i>`;
        }

        function searchMusic() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            currentPlaylist = allSongs.filter(s => s.title.toLowerCase().includes(query));
            renderPlaylist();
        }

        function togglePlay() { player.paused ? play() : pause(); }
        function play() { player.play(); playIcon.className = "fas fa-pause"; disk.style.animationPlayState = "running"; }
        function pause() { player.pause(); playIcon.className = "fas fa-play ml-1"; disk.style.animationPlayState = "paused"; }
        function next() { currentIndex = (currentIndex + 1) % allSongs.length; loadSong(currentIndex, true); }
        function prev() { currentIndex = (currentIndex - 1 + allSongs.length) % allSongs.length; loadSong(currentIndex, true); }

        player.ontimeupdate = () => {
            const prog = (player.currentTime / player.duration) * 100;
            document.getElementById('progressBar').value = prog || 0;
            const m = Math.floor(player.currentTime / 60);
            const s = Math.floor(player.currentTime % 60);
            document.getElementById('currentTime').innerText = `${m}:${s < 10 ? '0'+s : s}`;
            if(player.duration) {
                const dm = Math.floor(player.duration / 60);
                const ds = Math.floor(player.duration % 60);
                document.getElementById('durationTime').innerText = `${dm}:${ds < 10 ? '0'+ds : ds}`;
            }
        };

        document.getElementById('progressBar').oninput = (e) => { player.currentTime = (e.target.value / 100) * player.duration; };
        document.getElementById('volumeSlider').oninput = (e) => { player.volume = e.target.value / 100; };
        player.onended = () => next();

        fetchMusic();
    </script>
</body>
</html>
