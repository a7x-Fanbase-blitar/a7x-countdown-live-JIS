<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deathbat Player - Fire & Favorite Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap');
        :root { --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.15); }
        body { background: #000; font-family: 'Inter', sans-serif; overflow-x: hidden; color: #fff; height: 100vh; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        #particles-js { position: fixed; width: 100%; height: 100%; z-index: 0; background: #000; }
        .glass-panel { background: rgba(18, 18, 18, 0.5); backdrop-filter: blur(40px); border: 1px solid var(--glass-border); border-radius: 32px; }
        .sidebar-glass { background: rgba(8, 8, 8, 0.4); backdrop-filter: blur(20px); border-right: 1px solid var(--glass-border); }
        .active-song { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 16px; }
        input[type="range"] { -webkit-appearance: none; background: rgba(255,255,255,0.08); height: 4px; border-radius: 2px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #fff; border-radius: 50%; cursor: pointer; border: 2px solid #000; }
        .eq-slider { transform: rotate(-90deg); width: 80px !important; height: 4px; margin: 30px -25px; }
        #visualizer { position: absolute; bottom: 0; left: 0; width: 100%; height: 55vh; z-index: 1; pointer-events: none; opacity: 0.8; }
        .btn-request { background: linear-gradient(90deg, #dc2626, #f97316); box-shadow: 0 5px 20px rgba(239, 68, 68, 0.4); }
        .spin { animation: spin 20s linear infinite; }
        .paused { animation-play-state: paused; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .tab-active { color: #ef4444; border-bottom: 2px solid #ef4444; }
        
        .mobile-menu-btn { 
            position: fixed; top: 1.5rem; left: 1.5rem; z-index: 100;
            width: 55px; height: 55px; background: rgba(220, 38, 38, 0.8); 
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.5); border: 1px solid rgba(255,255,255,0.2);
        }

        @media (max-width: 1024px) {
            .sidebar-glass { position: absolute; width: 100%; height: 100%; z-index: 90; transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
            .sidebar-open { transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <canvas id="visualizer"></canvas>
    
    <button onclick="toggleSidebar()" class="lg:hidden mobile-menu-btn">
        <i class="fas fa-bars text-white text-2xl"></i>
    </button>

    <div class="relative z-10 flex h-screen overflow-hidden">
        <div id="sidebar" class="w-80 sidebar-glass flex flex-col lg:flex">
            <div class="p-8 flex-none">
                <div class="mb-8 flex items-center gap-3">
                    <img src="https://raw.githubusercontent.com/a7x-Fanbase-blitar/a7x-countdown-live-JIS/main/a7xblitar.png" class="w-10 h-10 rounded-full border border-white/20">
                    <h1 class="text-2xl font-orbitron font-black text-white">DEATHBAT</h1>
                </div>
                <a id="waRequest" href="#" target="_blank" class="btn-request flex items-center justify-center gap-3 text-white text-xs font-bold py-4 rounded-2xl mb-8 transition hover:scale-105"><i class="fab fa-whatsapp text-xl"></i> REQUEST LAGU</a>
                <div class="glass-panel p-4 mb-6 border border-white/5">
                    <div class="flex justify-around items-center h-24">
                        <div class="flex flex-col items-center"><input type="range" id="bassGain" min="-10" max="10" value="0" class="eq-slider"><span class="text-[9px] mt-10 text-zinc-400">BASS</span></div>
                        <div class="flex flex-col items-center"><input type="range" id="midGain" min="-10" max="10" value="0" class="eq-slider"><span class="text-[9px] mt-10 text-zinc-400">MID</span></div>
                        <div class="flex flex-col items-center"><input type="range" id="trebleGain" min="-10" max="10" value="0" class="eq-slider"><span class="text-[9px] mt-10 text-zinc-400">TREB</span></div>
                    </div>
                </div>
                <div class="flex space-x-6 text-[11px] font-bold uppercase tracking-widest mb-6 border-b border-white/5">
                    <button onclick="switchTab('all')" id="tab-all" class="pb-2 tab-active transition">Semua</button>
                    <button onclick="switchTab('fav')" id="tab-fav" class="pb-2 text-zinc-500 hover:text-white transition">Favorit</button>
                </div>
                <div class="relative mb-6"><i class="fas fa-search absolute left-5 top-4 text-zinc-500"></i><input type="text" id="searchInput" oninput="searchMusic()" placeholder="Search..." class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-12 text-sm text-white focus:outline-none"></div>
            </div>
            <div class="flex-1 overflow-y-auto px-4 pb-32" id="playlistContainer"></div>
        </div>

        <div class="flex-1 flex flex-col items-center justify-center p-4 relative main-content">
            <div class="glass-panel w-full max-w-2xl p-6 md:p-10 text-center relative overflow-hidden">
                <div class="relative inline-block mb-6 md:mb-10"><img id="diskCover" src="https://raw.githubusercontent.com/a7x-Fanbase-blitar/a7x-countdown-live-JIS/main/a7xblitar.png" class="w-48 h-48 md:w-80 md:h-80 rounded-full object-cover border-[10px] md:border-[14px] border-black shadow-2xl spin paused"></div>
                <h2 id="songTitle" class="text-2xl md:text-5xl font-orbitron font-extrabold mb-2 text-white uppercase tracking-tighter">Ready?</h2>
                <p class="text-zinc-400 text-sm md:text-lg font-semibold mb-10 tracking-widest">AVENGED SEVENFOLD</p>
                <div class="flex items-center justify-center gap-6">
                    <button onclick="toggleFavoriteCurrent()" id="favBtnMain" class="w-14 h-14 md:w-16 md:h-16 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-xl transition hover:bg-white/10"><i class="far fa-heart"></i></button>
                    <button onclick="shareSong()" class="w-14 h-14 md:w-16 md:h-16 rounded-2xl bg-white/10 border border-white/20 flex items-center justify-center text-2xl transition hover:scale-110 shadow-xl"><i class="fas fa-share-square"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 glass-panel !rounded-none border-t border-white/10 p-4 md:p-6 z-50">
        <div class="max-w-7xl mx-auto flex items-center gap-4">
            <div class="hidden sm:flex items-center w-1/4">
                <img id="miniCover" src="https://raw.githubusercontent.com/a7x-Fanbase-blitar/a7x-countdown-live-JIS/main/a7xblitar.png" class="w-12 h-12 rounded-xl mr-3 border border-white/10">
                <div class="truncate"><p id="miniTitle" class="font-bold text-xs text-white truncate">Pilih Lagu</p><p class="text-[9px] text-zinc-500 font-bold uppercase">A7X Nation</p></div>
            </div>
            <div class="flex-1 flex flex-col items-center">
                <div class="flex items-center gap-6 md:gap-10 mb-2">
                    <button onclick="prev()" class="text-white hover:text-red-500 transition text-xl"><i class="fas fa-step-backward"></i></button>
                    <button onclick="togglePlay()" class="w-12 h-12 rounded-full bg-white text-black flex items-center justify-center transition hover:scale-110 shadow-xl"><i id="playIcon" class="fas fa-play ml-1 text-lg"></i></button>
                    <button onclick="next()" class="text-white hover:text-red-500 transition text-xl"><i class="fas fa-step-forward"></i></button>
                </div>
                <div class="w-full flex items-center gap-3 text-[9px] font-mono text-zinc-500">
                    <span id="currentTime">0:00</span><input type="range" id="progressBar" value="0" class="flex-1"><span id="durationTime">0:00</span>
                </div>
            </div>
            <div class="hidden md:flex items-center justify-end w-1/4 gap-3"><i class="fas fa-volume-up text-zinc-500 text-xs"></i><input type="range" id="volumeSlider" min="0" max="100" value="80" class="w-20"></div>
        </div>
    </div>

    <audio id="audioPlayer" crossorigin="anonymous"></audio>

    <script>
        const GITHUB_USER = "a7x-Fanbase-blitar";
        const GITHUB_REPO = "aset-music";
        let allSongs = [], favorites = JSON.parse(localStorage.getItem('a7x_favs')) || [], currentTab = 'all';
        const player = document.getElementById('audioPlayer');

        let audioCtx, analyser, source, canvas, ctx, bassFilter, midFilter, trebleFilter;
        
        function initAudio() {
            if (audioCtx) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return;
            }
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256; 
            source = audioCtx.createMediaElementSource(player);
            bassFilter = audioCtx.createBiquadFilter(); bassFilter.type = "lowshelf"; bassFilter.frequency.value = 200;
            midFilter = audioCtx.createBiquadFilter(); midFilter.type = "peaking"; midFilter.frequency.value = 1000; midFilter.Q.value = 1;
            trebleFilter = audioCtx.createBiquadFilter(); trebleFilter.type = "highshelf"; trebleFilter.frequency.value = 3000;
            source.connect(bassFilter);
            bassFilter.connect(midFilter);
            midFilter.connect(trebleFilter);
            trebleFilter.connect(analyser);
            analyser.connect(audioCtx.destination);
            canvas = document.getElementById("visualizer"); 
            ctx = canvas.getContext("2d");
            drawVisualizer();
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);
            canvas.width = window.innerWidth;
            const cHeight = canvas.height; 
            ctx.clearRect(0, 0, canvas.width, cHeight);
            const barWidth = (canvas.width / bufferLength) * 2.5;
            let x = 0;
            for(let i = 0; i < bufferLength; i++) {
                let barHeight = (dataArray[i] / 255) * cHeight;
                const grad = ctx.createLinearGradient(0, cHeight, 0, cHeight - barHeight);
                grad.addColorStop(0, 'rgba(185, 28, 28, 0.8)'); 
                grad.addColorStop(1, 'rgba(249, 115, 22, 0.4)');
                ctx.fillStyle = grad; 
                ctx.fillRect(x, cHeight - barHeight, barWidth, barHeight); 
                x += barWidth + 1;
            }
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('sidebar-open'); }
        
        async function fetchMusic() {
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`);
                const files = await res.json();
                allSongs = files.filter(f => f.name.endsWith('.mp3')).map(f => ({
                    id: f.sha, 
                    fileName: f.name,
                    title: f.name.replace('.mp3', '').replace(/-/g, ' '), 
                    url: `https://cdn.jsdelivr.net/gh/${GITHUB_USER}/${GITHUB_REPO}/${f.name}`
                }));
                renderPlaylist();
                if(allSongs.length > 0) loadSong(allSongs[0].url, false);
            } catch (e) { console.error("Gagal ambil lagu", e); }
        }

        function renderPlaylist() {
            const container = document.getElementById('playlistContainer');
            const list = currentTab === 'all' ? allSongs : allSongs.filter(s => favorites.includes(s.id));
            container.innerHTML = "";
            
            list.forEach((s) => {
                const isFav = favorites.includes(s.id);
                // Deteksi lagu aktif berdasarkan ID sha agar lebih akurat dibanding URL string
                const isActive = player.src.includes(encodeURIComponent(s.fileName)) || player.src.includes(s.fileName);
                
                const div = document.createElement('div');
                div.className = `flex items-center p-3 mb-2 cursor-pointer transition hover:bg-white/5 ${isActive ? 'active-song' : ''}`;
                div.onclick = () => loadSong(s.url, true);
                div.innerHTML = `
                    <img src="https://raw.githubusercontent.com/a7x-Fanbase-blitar/a7x-countdown-live-JIS/main/a7xblitar.png" class="w-10 h-10 rounded-lg mr-3">
                    <div class="flex-1 truncate text-left"><p class="text-sm font-bold text-white truncate">${s.title}</p><p class="text-[10px] text-zinc-500">Avenged Sevenfold</p></div>
                    <i class="${isFav ? 'fas text-red-500' : 'far text-zinc-700'} fa-heart text-xs"></i>
                `;
                container.appendChild(div);
            });
        }

        function loadSong(url, auto) {
            const song = allSongs.find(s => url.includes(s.fileName));
            if(!song) return;
            player.src = url;
            document.getElementById('songTitle').innerText = song.title;
            document.getElementById('miniTitle').innerText = song.title;
            document.getElementById('waRequest').href = `https://wa.me/628175118886?text=Request:%20${song.title}`;
            updateFavBtnStatus(song.id);
            renderPlaylist();
            if(auto) { initAudio(); play(); }
            if(window.innerWidth < 1024) document.getElementById('sidebar').classList.remove('sidebar-open');
        }

        function togglePlay() { 
            initAudio(); 
            player.paused ? play() : pause(); 
        }

        function play() { 
            player.play().catch(e => console.log("Play failed")); 
            document.getElementById('playIcon').className = "fas fa-pause"; 
            document.getElementById('diskCover').classList.remove('paused'); 
        }

        function pause() { 
            player.pause(); 
            document.getElementById('playIcon').className = "fas fa-play ml-1"; 
            document.getElementById('diskCover').classList.add('paused'); 
        }
        
        function next() {
            const list = currentTab === 'all' ? allSongs : allSongs.filter(s => favorites.includes(s.id));
            let idx = list.findIndex(s => player.src.includes(s.fileName));
            const nextIdx = (idx + 1) % list.length;
            loadSong(list[nextIdx].url, true);
        }

        function prev() {
            const list = currentTab === 'all' ? allSongs : allSongs.filter(s => favorites.includes(s.id));
            let idx = list.findIndex(s => player.src.includes(s.fileName));
            const prevIdx = (idx - 1 + list.length) % list.length;
            loadSong(list[prevIdx].url, true);
        }

        function toggleFavoriteCurrent() {
            // Gunakan fileName untuk mencari lagu yang sedang diputar
            const currentFileName = decodeURIComponent(player.src.split('/').pop());
            const song = allSongs.find(s => s.fileName === currentFileName || player.src.includes(s.fileName));
            
            if(!song) return;
            
            const index = favorites.indexOf(song.id);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(song.id);
            }
            
            localStorage.setItem('a7x_favs', JSON.stringify(favorites));
            updateFavBtnStatus(song.id); 
            renderPlaylist();
        }

        function updateFavBtnStatus(id) {
            const isFav = favorites.includes(id);
            document.getElementById('favBtnMain').innerHTML = `<i class="${isFav ? 'fas text-red-500' : 'far fa-heart'}"></i>`;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-all').className = tab === 'all' ? 'pb-2 tab-active transition' : 'pb-2 text-zinc-500 hover:text-white transition';
            document.getElementById('tab-fav').className = tab === 'fav' ? 'pb-2 tab-active transition' : 'pb-2 text-zinc-500 hover:text-white transition';
            renderPlaylist();
        }

        function shareSong() {
            const currentFileName = decodeURIComponent(player.src.split('/').pop());
            const song = allSongs.find(s => s.fileName === currentFileName);
            if(!song) return;
            const text = `Lagi dengerin "${song.title}" di Deathbat Player! 🔥`;
            if (navigator.share) navigator.share({ title: 'Deathbat Player', text: text, url: window.location.href });
            else { navigator.clipboard.writeText(text + " " + window.location.href); alert("Link disalin!"); }
        }

        function searchMusic() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('#playlistContainer > div');
            items.forEach(item => {
                const title = item.querySelector('p').innerText.toLowerCase();
                item.style.display = title.includes(query) ? 'flex' : 'none';
            });
        }

        player.ontimeupdate = () => {
            const prog = (player.currentTime / player.duration) * 100 || 0;
            document.getElementById('progressBar').value = prog;
            const fmt = (t) => { const m = Math.floor(t/60)||0, s = Math.floor(t%60)||0; return `${m}:${s<10?'0'+s:s}`; };
            document.getElementById('currentTime').innerText = fmt(player.currentTime);
            document.getElementById('durationTime').innerText = fmt(player.duration);
        };

        document.getElementById('progressBar').oninput = (e) => { player.currentTime = (e.target.value/100)*player.duration; };
        document.getElementById('volumeSlider').oninput = (e) => { player.volume = e.target.value/100; };
        player.onended = next;

        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 150, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": ["#ff4400", "#ffcc00", "#ff0000"] },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.8, "random": true, "anim": { "enable": true, "speed": 1, "opacity_min": 0.1 } },
                "size": { "value": 3, "random": true, "anim": { "enable": true, "speed": 4, "size_min": 0.5 } },
                "move": { "enable": true, "speed": 5, "direction": "top", "random": true, "straight": false, "out_mode": "out" }
            }
        });

        document.getElementById('bassGain').oninput = (e) => { if(bassFilter) bassFilter.gain.value = e.target.value; };
        document.getElementById('midGain').oninput = (e) => { if(midFilter) midFilter.gain.value = e.target.value; };
        document.getElementById('trebleGain').oninput = (e) => { if(trebleFilter) trebleFilter.gain.value = e.target.value; };
        
        fetchMusic();
    </script>
</body>
</html>
