<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deathbat Player - Premium Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap');
        
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body { 
            background: #000; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            color: #fff;
            height: 100vh;
        }

        .font-orbitron { font-family: 'Orbitron', sans-serif; }

        #particles-js { 
            position: fixed; width: 100%; height: 100%; z-index: 0; 
            background: radial-gradient(circle at center, #1a0505 0%, #000 100%);
        }

        /* GLASSMORPHISM STYLE */
        .glass-panel {
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
        }

        .sidebar-glass {
            background: rgba(10, 10, 10, 0.4);
            backdrop-filter: blur(15px);
            border-right: 1px solid var(--glass-border);
        }

        /* SONG ITEM ACTIVE */
        .active-song {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        /* CUSTOM RANGE INPUT (SLIDER) */
        input[type="range"] {
            -webkit-appearance: none;
            background: rgba(255,255,255,0.1);
            height: 4px;
            border-radius: 2px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        #visualizer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            z-index: 1;
            pointer-events: none;
        }

        .btn-request {
            background: linear-gradient(90deg, #ef4444, #f97316);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

    <div id="particles-js"></div>
    <canvas id="visualizer"></canvas>

    <div class="relative z-10 flex h-screen overflow-hidden">
        
        <div class="w-80 sidebar-glass flex flex-col hidden md:flex">
            <div class="p-8 flex-none">
                <div class="mb-8">
                    <h1 class="text-2xl font-orbitron font-black tracking-tighter">DEATHBAT</h1>
                    <p class="text-[9px] text-zinc-400 tracking-[0.4em] font-bold uppercase opacity-70">Community Player</p>
                </div>

                <a id="waRequest" href="#" target="_blank" class="btn-request flex items-center justify-center gap-3 text-white text-xs font-bold py-3.5 rounded-2xl mb-8 transition hover:scale-105 active:scale-95">
                    <i class="fab fa-whatsapp text-lg"></i> REQUEST LAGU
                </a>

                <div class="relative mb-8">
                    <i class="fas fa-search absolute left-4 top-4 text-zinc-500"></i>
                    <input type="text" id="searchInput" oninput="searchMusic()" placeholder="Search..." 
                           class="w-full bg-white/5 border border-white/10 rounded-2xl py-3.5 pl-12 pr-4 text-sm focus:outline-none focus:border-white/30 transition">
                </div>

                <div class="flex space-x-8 text-[11px] font-bold uppercase tracking-widest border-b border-white/5 pb-2">
                    <button onclick="switchTab('all')" id="tab-all" class="text-white border-b-2 border-red-600 pb-2">Semua</button>
                    <button onclick="switchTab('fav')" id="tab-fav" class="text-zinc-500 hover:text-white transition pb-2">Favorit Saya</button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto px-4 pb-32" id="playlistContainer">
                </div>
        </div>

        <div class="flex-1 flex flex-col items-center justify-center p-4 relative">
            <div class="glass-panel w-full max-w-xl p-8 md:p-12 text-center relative overflow-hidden">
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-red-600/20 blur-[120px] -z-10"></div>

                <div class="relative inline-block mb-8">
                    <img id="diskCover" src="https://raw.githubusercontent.com/a7x-Fanbase-blitar/a7x-countdown-live-JIS/main/a7xblitar.png" 
                         class="w-48 h-48 md:w-72 md:h-72 rounded-full object-cover border-[8px] border-black/50 shadow-2xl animate-[spin_20s_linear_infinite] [animation-play-state:paused]">
                </div>

                <h2 id="songTitle" class="text-3xl md:text-5xl font-orbitron font-bold mb-3 tracking-tight">Ready?</h2>
                <p id="songArtist" class="text-zinc-400 text-lg md:text-xl font-medium mb-8">Avenged Sevenfold</p>

                <div class="mb-10 min-h-[1.5em]">
                    <p id="lyricsText" class="text-zinc-300 italic opacity-80">Music is the weapon...</p>
                </div>

                <div class="flex items-center justify-center gap-6">
                    <button id="favBtnMain" onclick="toggleFavoriteCurrent()" class="w-16 h-16 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-2xl transition hover:bg-white/10">
                        <i class="far fa-heart"></i>
                    </button>
                    
                    <button onclick="shareSong()" class="w-16 h-16 rounded-2xl bg-white/10 border border-white/20 flex items-center justify-center text-2xl transition hover:scale-110 active:scale-95 shadow-lg">
                        <i class="fas fa-share-square"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 glass-panel !rounded-none border-t border-white/10 p-6 z-50">
        <div class="max-w-7xl mx-auto flex items-center gap-8">
            
            <div class="hidden lg:flex items-center w-1/4">
                <img id="miniCover" src="https://raw.githubusercontent.com/a7x-Fanbase-blitar/a7x-countdown-live-JIS/main/a7xblitar.png" class="w-14 h-14 rounded-xl object-cover mr-4 border border-white/10">
                <div class="truncate">
                    <p id="miniTitle" class="font-bold text-sm truncate">Pilih Lagu</p>
                    <p id="miniArtist" class="text-[10px] text-zinc-500 uppercase font-bold tracking-widest">Avenged Sevenfold</p>
                </div>
            </div>

            <div class="flex-1 flex flex-col items-center">
                <div class="flex items-center gap-10 mb-3">
                    <button class="text-zinc-500 hover:text-white transition text-sm"><i class="fas fa-random"></i></button>
                    <button onclick="prev()" class="text-white hover:text-red-500 transition text-xl"><i class="fas fa-step-backward"></i></button>
                    <button onclick="togglePlay()" class="w-12 h-12 rounded-full bg-white text-black flex items-center justify-center transition hover:scale-110 active:scale-90">
                        <i id="playIcon" class="fas fa-play ml-1"></i>
                    </button>
                    <button onclick="next()" class="text-white hover:text-red-500 transition text-xl"><i class="fas fa-step-forward"></i></button>
                    <button class="text-zinc-500 hover:text-white transition text-sm"><i class="fas fa-redo"></i></button>
                </div>
                
                <div class="w-full flex items-center gap-4 text-[10px] font-mono text-zinc-500">
                    <span id="currentTime">00:00</span>
                    <input type="range" id="progressBar" value="0" class="flex-1 cursor-pointer">
                    <span id="durationTime">00:00</span>
                </div>
            </div>

            <div class="hidden md:flex items-center justify-end w-1/4 gap-4">
                <i class="fas fa-volume-up text-zinc-500"></i>
                <input type="range" id="volumeSlider" min="0" max="100" value="80" class="w-24 cursor-pointer">
                <button class="text-zinc-500 hover:text-white ml-2"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" crossorigin="anonymous"></audio>

    <script>
        const GITHUB_USER = "a7x-Fanbase-blitar";
        const GITHUB_REPO = "aset-music";
        const ADMIN_WA = "6281234567890";
        
        let allSongs = [];
        let currentPlaylist = [];
        let favorites = JSON.parse(localStorage.getItem('a7x_favs')) || [];
        let currentIndex = 0;
        let currentTab = 'all';

        const player = document.getElementById('audioPlayer');
        const playIcon = document.getElementById('playIcon');
        const disk = document.getElementById('diskCover');

        // FIRE PARTICLES
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": ["#ff3300", "#ff6600", "#ffcc00"] },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.3, "random": true },
                "size": { "value": 2, "random": true },
                "move": { "enable": true, "speed": 2.5, "direction": "top", "random": true, "out_mode": "out" }
            }
        });

        // AUDIO VISUALIZER
        let audioCtx, analyser, source, canvas, ctx;
        function initVisualizer() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            source = audioCtx.createMediaElementSource(player);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.fftSize = 256;
            canvas = document.getElementById("visualizer");
            ctx = canvas.getContext("2d");
            drawVisualizer();
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);
            canvas.width = window.innerWidth;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const barWidth = (canvas.width / bufferLength) * 2;
            let x = 0;
            for(let i = 0; i < bufferLength; i++) {
                let barHeight = dataArray[i] / 1.8;
                ctx.fillStyle = `rgba(239, 68, 68, ${barHeight/250})`;
                ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
        }

        async function fetchMusic() {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`);
                const files = await response.json();
                if (Array.isArray(files)) {
                    allSongs = files.filter(f => f.name.toLowerCase().endsWith('.mp3')).map(f => ({
                        id: f.sha,
                        title: f.name.replace('.mp3', '').replace(/_/g, ' ').replace(/-/g, ' '),
                        url: `https://cdn.jsdelivr.net/gh/${GITHUB_USER}/${GITHUB_REPO}/${f.name}`
                    }));
                    currentPlaylist = [...allSongs];
                    renderPlaylist();
                    if(allSongs.length > 0) loadSong(0, false);
                }
            } catch (e) { console.error(e); }
        }

        function renderPlaylist() {
            const container = document.getElementById('playlistContainer');
            const list = currentTab === 'all' ? currentPlaylist : allSongs.filter(s => favorites.includes(s.id));
            container.innerHTML = list.map((song, i) => {
                const isActive = player.src === song.url;
                return `
                    <div onclick="selectSong('${song.url}')" class="flex items-center p-3 mb-2 rounded-2xl cursor-pointer transition hover:bg-white/5 ${isActive ? 'active-song' : 'border border-transparent'}">
                        <img src="https://raw.githubusercontent.com/a7x-Fanbase-blitar/a7x-countdown-live-JIS/main/a7xblitar.png" class="w-10 h-10 rounded-lg mr-3">
                        <div class="flex-1 truncate">
                            <p class="text-sm font-bold truncate">${song.title}</p>
                            <p class="text-[10px] text-zinc-500 font-bold uppercase">Avenged Sevenfold</p>
                        </div>
                        ${isActive ? '<div class="w-2 h-2 bg-red-600 rounded-full animate-pulse"></div>' : ''}
                    </div>
                `;
            }).join('');
        }

        function selectSong(url) { loadSong(allSongs.findIndex(s => s.url === url), true); }

        function loadSong(i, auto) {
            currentIndex = i;
            const song = allSongs[i];
            player.src = song.url;
            document.getElementById('songTitle').innerText = song.title;
            document.getElementById('miniTitle').innerText = song.title;
            document.getElementById('waRequest').href = `https://wa.me/${ADMIN_WA}?text=Request%20Lagu:%20${song.title}`;
            updateFavBtnStatus(song.id);
            renderPlaylist();
            if(auto) play();
        }

        function shareSong() {
            const text = `Lagi dengerin "${allSongs[currentIndex].title}" di Deathbat Player! 🔥`;
            if (navigator.share) {
                navigator.share({ title: 'Deathbat Player', text: text, url: window.location.href });
            } else {
                alert("Link copied!");
            }
        }

        function togglePlay() { 
            initVisualizer(); 
            if (audioCtx.state === 'suspended') audioCtx.resume();
            player.paused ? play() : pause(); 
        }

        function play() { player.play(); playIcon.className = "fas fa-pause"; disk.style.animationPlayState = "running"; }
        function pause() { player.pause(); playIcon.className = "fas fa-play ml-1"; disk.style.animationPlayState = "paused"; }
        function next() { loadSong((currentIndex + 1) % allSongs.length, true); }
        function prev() { loadSong((currentIndex - 1 + allSongs.length) % allSongs.length, true); }

        function toggleFavoriteCurrent() {
            const id = allSongs[currentIndex].id;
            favorites = favorites.includes(id) ? favorites.filter(f => f !== id) : [...favorites, id];
            localStorage.setItem('a7x_favs', JSON.stringify(favorites));
            updateFavBtnStatus(id);
            renderPlaylist();
        }

        function updateFavBtnStatus(id) {
            const isFav = favorites.includes(id);
            const btn = document.getElementById('favBtnMain');
            btn.innerHTML = `<i class="${isFav ? 'fas text-red-500' : 'far text-zinc-400'} fa-heart"></i>`;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-all').className = tab === 'all' ? 'text-white border-b-2 border-red-600 pb-2' : 'text-zinc-500 hover:text-white transition pb-2';
            document.getElementById('tab-fav').className = tab === 'fav' ? 'text-white border-b-2 border-red-600 pb-2' : 'text-zinc-500 hover:text-white transition pb-2';
            renderPlaylist();
        }

        player.ontimeupdate = () => {
            const prog = (player.currentTime / player.duration) * 100 || 0;
            document.getElementById('progressBar').value = prog;
            const formatTime = (t) => {
                const m = Math.floor(t / 60) || 0;
                const s = Math.floor(t % 60) || 0;
                return `${m}:${s < 10 ? '0'+s : s}`;
            }
            document.getElementById('currentTime').innerText = formatTime(player.currentTime);
            document.getElementById('durationTime').innerText = formatTime(player.duration);
        };

        document.getElementById('progressBar').oninput = (e) => { player.currentTime = (e.target.value / 100) * player.duration; };
        document.getElementById('volumeSlider').oninput = (e) => { player.volume = e.target.value / 100; };
        player.onended = () => next();

        fetchMusic();
    </script>
</body>
</html>
