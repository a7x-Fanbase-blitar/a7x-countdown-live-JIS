<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deathbat Shop - Timber & Hellfire Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.95)), 
                        url('https://www.transparenttextures.com/patterns/dark-wood.png'), #0a0a0a;
            background-attachment: fixed;
            background-size: cover;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
        }

        .fire-bg {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 20vh;
            background: linear-gradient(to top, rgba(239, 68, 68, 0.4), transparent);
            z-index: -1;
            filter: blur(50px);
            animation: flame-move 3s infinite alternate;
        }

        @keyframes flame-move {
            from { transform: scaleY(1); opacity: 0.4; }
            to { transform: scaleY(1.4); opacity: 0.7; }
        }

        .a7x-title {
            font-family: 'Metal Mania', cursive;
            color: #ef4444;
            text-shadow: 0 0 15px #ff0000;
        }

        .ultra-glass {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(239, 68, 68, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .preview-animate {
            animation: float 5s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(1deg); }
        }

        input, textarea, select {
            background: rgba(255,255,255,0.03) !important;
            border: 1px solid rgba(239, 68, 68, 0.15) !important;
            color: white !important;
            transition: all 0.3s ease;
        }
        input:focus { border-color: #ef4444 !important; box-shadow: 0 0 15px rgba(239,68,68,0.4); background: rgba(239,68,68,0.05) !important; }
        
        .swal2-popup {
            background: #0a0a0a !important;
            border: 2px solid #ef4444 !important;
            color: #fff !important;
        }
    </style>
</head>
<body class="p-4 sm:p-8 lg:p-12">

    <div class="fire-bg"></div>

    <header class="text-center mb-10 lg:mb-20">
        <h1 class="a7x-title text-5xl sm:text-7xl lg:text-9xl uppercase tracking-tighter leading-none">PRE-ORDER A7X BLITAR</h1>
        <p class="text-[8px] sm:text-[10px] tracking-[0.3em] sm:tracking-[0.5em] text-red-500 font-black mt-4 uppercase"> • Blitar Nation Merch • </p>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-16 items-start">
        
        <!-- PREVIEW PRODUK -->
        <div class="space-y-6 lg:sticky lg:top-12">
            <div class="ultra-glass p-3 sm:p-5 rounded-[2rem] sm:rounded-[3rem] relative group preview-animate">
                <img src="pre-order.jpeg" alt="Kaos Blitar Merch" class="w-full aspect-[3/4] object-cover rounded-[1.5rem] sm:rounded-[2.5rem] shadow-2xl transition-all duration-700">
                <div class="absolute top-6 left-6 sm:top-10 sm:left-10 bg-red-600 text-black font-black text-xs sm:text-sm px-4 sm:px-6 py-2 rounded-lg -rotate-6 shadow-2xl">PRE-ORDER OPEN</div>
            </div>
            
            <div class="ultra-glass p-6 rounded-3xl border-l-4 border-red-600">
                <h3 class="text-red-500 font-black text-xs uppercase mb-3 flex items-center"><i class="fas fa-skull-crossbones mr-2"></i> Payment Info</h3>
                <div class="text-[10px] sm:text-xs text-gray-400 font-bold uppercase space-y-1">
                    <div class="flex justify-between border-b border-white/5 pb-1"><span>BCA</span><span>123456789</span></div>
                    <div class="flex justify-between border-b border-white/5 pb-1 mt-2"><span>OVO/DANA</span><span>087753855074</span></div>
                    <p class="text-[8px] text-red-600/60 mt-2">*A/N THE FALLEN</p>
                </div>
            </div>
        </div>

        <!-- FORM ORDER -->
        <div class="ultra-glass p-6 sm:p-10 rounded-[2.5rem] sm:rounded-[4rem]">
            <form id="orderForm" class="space-y-6">
                <div class="flex items-center gap-4 mb-4">
                    <h2 class="a7x-title text-xl sm:text-3xl uppercase">Order Form</h2>
                    <div class="h-[1px] flex-1 bg-gradient-to-r from-red-600/50 to-transparent"></div>
                </div>

                <div class="space-y-4">
                    <input type="text" id="nama" placeholder="NAMA LENGKAP" required class="w-full p-4 rounded-2xl text-[10px] sm:text-xs font-bold uppercase tracking-widest outline-none">
                    <input type="number" id="wa" placeholder="WHATSAPP (628...)" required class="w-full p-4 rounded-2xl text-[10px] sm:text-xs font-bold uppercase tracking-widest outline-none">
                    <textarea id="alamat" placeholder="ALAMAT LENGKAP" required class="w-full p-4 rounded-2xl text-[10px] sm:text-xs font-bold uppercase h-24 tracking-widest outline-none resize-none"></textarea>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <select id="ukuran" required class="p-4 rounded-2xl text-[10px] sm:text-xs font-bold uppercase tracking-widest cursor-pointer outline-none">
                        <option value="" disabled selected>SIZE</option>
                        <option value="S">S</option><option value="M">M</option><option value="L">L</option><option value="XL">XL</option><option value="XXL">XXL</option>
                    </select>
                    <select id="metode" required class="p-4 rounded-2xl text-[10px] sm:text-xs font-bold uppercase tracking-widest cursor-pointer outline-none">
                        <option value="DP 50%">DP 50%</option><option value="LUNAS">LUNAS</option>
                    </select>
                </div>

                <select id="pembayaran" required class="w-full p-4 rounded-2xl text-[10px] sm:text-xs font-bold uppercase tracking-widest cursor-pointer outline-none">
                    <option value="" disabled selected>TUJUAN TRANSFER</option>
                    <option value="BCA">BCA - 123456789</option>
                    <option value="DANA">DANA - 087753855074</option>
                </select>

                <div class="relative group">
                    <input type="text" id="kupon" placeholder="KODE KUPON RAHASIA" class="w-full p-4 rounded-2xl text-[10px] sm:text-xs font-bold uppercase tracking-widest pr-24 outline-none">
                    <button type="button" onclick="cekKupon()" class="absolute right-2 top-2 bg-red-600 text-black px-4 py-2 rounded-xl text-[9px] font-black hover:bg-white hover:scale-105 transition-all">CHECK</button>
                </div>

                <div class="bg-black/50 p-6 rounded-3xl text-center border-b-4 border-red-600 ring-1 ring-red-600/20">
                    <p class="text-[8px] text-gray-500 uppercase mb-1 tracking-[0.2em]">Estimation Total</p>
                    <h3 id="displayHarga" class="text-3xl sm:text-4xl font-black text-white transition-all duration-500">Rp 185.000</h3>
                </div>

                <button type="submit" id="btnSubmit" class="w-full bg-red-600 hover:bg-white text-black font-black py-5 rounded-[2rem] uppercase tracking-widest text-[10px] sm:text-xs transition-all duration-500 shadow-xl hover:shadow-red-600/20 group">
                    KIRIM PESANAN SEKARANG <i class="fas fa-bolt ml-2 group-hover:animate-bounce"></i>
                </button>
            </form>
        </div>
    </main>

    <footer class="mt-20 lg:mt-32 opacity-40 text-center pb-12 border-t border-red-600/10 pt-10">
        <p class="text-[8px] sm:text-[10px] tracking-[0.4em] font-black uppercase">MADE WITH HELL BY THE FALLEN_BLITAR &copy; 2026</p>
    </footer>

    <script>
        const HARGA_DASAR = 185000;

        // Validasi kupon kini hanya memberikan notifikasi bahwa pengecekan akan dilakukan saat submit.
        // Daftar kupon di frontend telah dihapus total.
        function cekKupon() {
            const code = document.getElementById('kupon').value.trim();
            if (code === "") {
                Swal.fire({ title: 'DAMN! 💀', text: 'Masukkan kode kupon.', icon: 'warning' });
                return;
            }
            Swal.fire({
                title: 'COUPON ENTERED 🤘',
                text: 'Kupon akan divalidasi oleh sistem saat Anda mengirim pesanan.',
                icon: 'info',
                confirmButtonText: 'UNDERSTOOD'
            });
        }

        document.getElementById('orderForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const originalBtnText = btn.innerHTML;
            
            btn.innerHTML = '<i class="fas fa-skull fa-spin mr-2"></i> BURNING...'; 
            btn.disabled = true;

            const formData = {
                nama: document.getElementById('nama').value,
                wa: document.getElementById('wa').value,
                alamat: document.getElementById('alamat').value,
                ukuran: document.getElementById('ukuran').value,
                metode: document.getElementById('metode').value,
                pembayaran: document.getElementById('pembayaran').value,
                kupon: document.getElementById('kupon').value.toUpperCase().trim()
            };

            try {
                const response = await fetch("https://script.google.com/macros/s/AKfycbwdnyJU5XKdped6XomgBQ__qxzh4TqPDou90O6jt3cWww32EK2mUw0Hpc0LMeEISv0W/exec", { 
                    method: 'POST', 
                    body: JSON.stringify(formData) 
                });
                
                const result = await response.json();

                if (result.status === "success") {
                    Swal.fire({ title: 'SUCCESS! 🤘', text: 'Data tersimpan! Menuju WhatsApp...', icon: 'success', timer: 2500, showConfirmButton: false });

                    setTimeout(() => {
                        const msgWA = `HELL YEAH! 🤘\n\nNama: ${formData.nama}\nUkuran: ${formData.ukuran}\nTotal: Rp ${result.total.toLocaleString('id-ID')}\n\nSaya konfirmasi Pre-Order. Berikut bukti transfernya:`;
                        window.open(`https://wa.me/6287753855074?text=${encodeURIComponent(msgWA)}`, '_blank');
                        location.reload();
                    }, 2000);
                } else {
                    Swal.fire('ERROR!', result.message || 'Gagal memproses pesanan.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = originalBtnText;
                }
            } catch (error) { 
                Swal.fire('ERROR!', 'Gagal terhubung ke server.', 'error');
                btn.disabled = false;
                btn.innerHTML = originalBtnText;
            }
        };
    </script>
</body>
</html>
