<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deathbat Shop - Timber & Hellfire Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), 
                        url('https://www.transparenttextures.com/patterns/dark-wood.png'), #1a1a1a;
            background-attachment: fixed;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
        }

        .fire-bg {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 250px;
            background: linear-gradient(to top, rgba(239, 68, 68, 0.3), transparent);
            z-index: -1;
            filter: blur(40px);
            animation: flame-move 3s infinite alternate;
        }

        @keyframes flame-move {
            from { transform: scaleY(1); opacity: 0.5; }
            to { transform: scaleY(1.3); opacity: 0.8; }
        }

        .a7x-title {
            font-family: 'Metal Mania', cursive;
            color: #ef4444;
            text-shadow: 0 0 20px #ff0000;
        }

        .ultra-glass {
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(239, 68, 68, 0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .swal2-popup {
            background: #111 !important;
            border: 2px solid #ef4444 !important;
            border-radius: 20px !important;
            color: #fff !important;
            font-family: 'Orbitron', sans-serif !important;
        }
        .swal2-title { font-family: 'Metal Mania', cursive !important; color: #ef4444 !important; }
        .swal2-confirm { background-color: #ef4444 !important; font-weight: bold !important; }

        input, textarea, select {
            background: rgba(255,255,255,0.05) !important;
            border: 1px solid rgba(239, 68, 68, 0.2) !important;
            color: white !important;
            transition: 0.3s;
        }
        input:focus { border-color: #ef4444 !important; box-shadow: 0 0 10px rgba(239,68,68,0.3); }

        /* Floating Animation untuk Preview Box */
        .preview-animate {
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="p-4 md:p-12">

    <div class="fire-bg"></div>

    <header class="text-center mb-16">
        <h1 class="a7x-title text-6xl md:text-8xl uppercase tracking-tighter">PRE-ORDER DEATHBAT BLITAR</h1>
        <p class="text-[10px] tracking-[0.5em] text-red-500 font-black mt-4 uppercase"> • Blitar Nation Merch •</p>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 items-start">
        
        <!-- PREVIEW PRODUK -->
        <div class="lg:sticky lg:top-8 space-y-6">
            <div class="ultra-glass p-4 rounded-[2.5rem] relative group preview-animate">
                <img src="Kaos-Blitar.jpeg" class="w-full h-[550px] object-cover rounded-[2rem] shadow-2xl grayscale-[30%] group-hover:grayscale-0 transition-all duration-700">
                <div class="absolute top-8 left-8 bg-red-600 text-black font-black px-6 py-2 rounded-lg -rotate-6 shadow-xl">PRE-ORDER OPEN</div>
            </div>
            
            <div class="ultra-glass p-6 rounded-3xl border-r-4 border-red-600">
                <h3 class="text-red-500 font-black text-xs uppercase mb-3"><i class="fas fa-coins mr-2"></i>Payment Info</h3>
                <div class="text-[10px] text-gray-400 font-bold uppercase space-y-1">
                    <p>BCA: 123456789 (THE FALLEN)</p>
                    <p>OVO/DANA: 087753855074</p>
                </div>
            </div>
        </div>

        <!-- FORM ORDER -->
        <div class="ultra-glass p-8 md:p-10 rounded-[3rem]">
            <form id="orderForm" class="space-y-5">
                <div class="flex items-center gap-4 mb-6">
                    <div class="h-[2px] flex-1 bg-red-600/30"></div>
                    <h2 class="a7x-title text-2xl uppercase">Order Form</h2>
                    <div class="h-[2px] flex-1 bg-red-600/30"></div>
                </div>

                <input type="text" id="nama" placeholder="NAMA LENGKAP" required class="w-full p-4 rounded-xl text-xs font-bold uppercase tracking-widest">
                <input type="number" id="wa" placeholder="WHATSAPP (628...)" required class="w-full p-4 rounded-xl text-xs font-bold uppercase tracking-widest">
                <textarea id="alamat" placeholder="ALAMAT LENGKAP" required class="w-full p-4 rounded-xl text-xs font-bold uppercase h-24 tracking-widest"></textarea>
                
                <div class="grid grid-cols-2 gap-4">
                    <select id="ukuran" required class="p-4 rounded-xl text-xs font-bold uppercase tracking-widest">
                        <option value="" disabled selected>SIZE</option>
                        <option value="S">S</option><option value="M">M</option><option value="L">L</option><option value="XL">XL</option><option value="XXL">XXL</option>
                    </select>
                    <select id="metode" required class="p-4 rounded-xl text-xs font-bold uppercase tracking-widest">
                        <option value="DP 50%">DP 50%</option><option value="LUNAS">LUNAS</option>
                    </select>
                </div>

                <select id="pembayaran" required class="w-full p-4 rounded-xl text-xs font-bold uppercase tracking-widest">
                    <option value="" disabled selected>TUJUAN TRANSFER</option>
                    <option value="BCA">BCA - 123456789</option>
                    <option value="DANA">DANA - 087753855074</option>
                </select>

                <div class="relative">
                    <input type="text" id="kupon" placeholder="KODE KUPON RAHASIA" class="w-full p-4 rounded-xl text-xs font-bold uppercase tracking-widest pr-20">
                    <button type="button" onclick="cekKupon()" class="absolute right-2 top-2 bg-red-600 text-black px-4 py-2 rounded-lg text-[10px] font-black hover:bg-white transition-all">CHECK</button>
                </div>

                <div class="bg-black p-6 rounded-2xl text-center border-b-4 border-red-600 shadow-inner">
                    <p class="text-[9px] text-gray-500 uppercase mb-1 tracking-widest">Estimation Total</p>
                    <h3 id="displayHarga" class="text-3xl font-black text-white">Rp 185.000</h3>
                </div>

                <button type="submit" id="btnSubmit" class="w-full bg-red-600 hover:bg-white text-black font-black py-5 rounded-2xl uppercase tracking-widest text-xs transition-all duration-500 shadow-[0_0_20px_rgba(239,68,68,0.3)]">
                    KIRIM PESANAN SEKARANG 🤘
                </button>
            </form>
        </div>
    </main>

    <footer class="mt-24 opacity-30 text-center pb-10">
        <p class="text-[9px] tracking-[0.5em] font-black uppercase">&copy; 2026 THE FALLEN_BLITAR • TIMBER & HELLFIRE DIVISION</p>
    </footer>

    <script>
        const HARGA_DASAR = 185000;
        const DAFTAR_KUPON = {
            "A7XBLITAR": 0.20,
            "DEATHBAT2026": 0.20,
            "THEFALLEN": 0.25
        };

        function cekKupon() {
            const code = document.getElementById('kupon').value.toUpperCase();
            const display = document.getElementById('displayHarga');
            
            if (DAFTAR_KUPON[code]) {
                const diskon = DAFTAR_KUPON[code];
                const hargaSetelahDiskon = HARGA_DASAR - (HARGA_DASAR * diskon);
                
                // Update tampilan harga dengan animasi
                display.innerText = "Rp " + hargaSetelahDiskon.toLocaleString('id-ID');
                display.classList.add('text-red-500');
                
                Swal.fire({
                    title: 'ROCK ON! 🤘',
                    text: `Kode kupon valid! Kamu mendapatkan potongan ${(diskon * 100)}%. Harga telah diperbarui.`,
                    icon: 'success',
                    confirmButtonText: 'HELL YEAH!'
                });
            } else {
                // Reset harga jika kupon salah
                display.innerText = "Rp " + HARGA_DASAR.toLocaleString('id-ID');
                display.classList.remove('text-red-500');
                
                Swal.fire({
                    title: 'DAMN! 💀',
                    text: 'Kode kupon tidak valid. Masukkan kode yang benar untuk mendapatkan potongan.',
                    icon: 'error',
                    confirmButtonText: 'TRY AGAIN'
                });
            }
        }

        document.getElementById('orderForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerText = "BURNING YOUR ORDER..."; 
            btn.disabled = true;

            const formData = {
                nama: document.getElementById('nama').value,
                wa: document.getElementById('wa').value,
                alamat: document.getElementById('alamat').value,
                ukuran: document.getElementById('ukuran').value,
                metode: document.getElementById('metode').value,
                pembayaran: document.getElementById('pembayaran').value,
                kupon: document.getElementById('kupon').value.toUpperCase()
            };

            try {
                // Gunakan URL GAS Anda yang sudah diperbarui (versi tanpa Drive)
                const response = await fetch("https://script.google.com/macros/s/AKfycbyV0FHEBrcGY-mYRLjeAO472b8KQllB-cnAo9gbUzXWvdGIZCbW4ZxCjtZ9MoL94oKj/exec", { 
                    method: 'POST', 
                    body: JSON.stringify(formData) 
                });
                
                const result = await response.json();

                if (result.status === "success") {
                    Swal.fire({
                        title: 'SUCCESS! 🤘',
                        text: 'Pesananmu sudah masuk ke daftar pahlawan Blitar! Mengalihkan ke WhatsApp...',
                        icon: 'success',
                        timer: 3000,
                        showConfirmButton: false
                    });

                    setTimeout(() => {
                        const msgWA = `HELL YEAH! 🤘\n\nNama: ${formData.nama}\nUkuran: ${formData.ukuran}\nTotal: Rp ${result.total.toLocaleString('id-ID')}\n\nSaya mengonfirmasi Pre-Order. Berikut saya lampirkan bukti transfernya:`;
                        window.open(`https://wa.me/6287753855074?text=${encodeURIComponent(msgWA)}`, '_blank');
                        location.reload();
                    }, 2000);
                }
            } catch (error) { 
                // Karena mode: no-cors tidak bisa membaca JSON, 
                // pastikan backend GAS Anda mengembalikan response JSON yang benar.
                Swal.fire('ERROR!', 'Terjadi gangguan koneksi. Pastikan data sudah masuk ke sheet!', 'error');
                btn.disabled = false;
                btn.innerText = "KIRIM PESANAN SEKARANG 🤘";
            }
        };
    </script>
</body>
</html>
