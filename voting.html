<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Seragam - Deathbat Blitar Raya</title>

    <!-- SEO & SHARE LINK OPTIMIZATION -->
    <meta property="og:title" content="Voting Seragam Deathbat Blitar Raya">
    <meta property="og:description" content="Tentukan seragam resmi komunitas kita untuk tahun 2026!">
    <meta property="og:image" content="a7xblitar.png"> 
    <meta property="og:url" content="https://website-anda.com">
    <meta name="theme-color" content="#ef4444">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), url('a7x-bg.jpg');
            background-attachment: fixed;
            background-size: cover;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .metal-font { font-family: 'Metal Mania', cursive; }
        
        .neon-text {
            text-shadow: 0 0 10px #ef4444, 0 0 20px #ef4444, 0 0 40px #ff0000;
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { filter: brightness(1); text-shadow: 0 0 10px #ef4444; }
            50% { filter: brightness(1.5); text-shadow: 0 0 30px #ff0000, 0 0 50px #ff0000; }
        }

        .ultra-glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .vote-card { cursor: pointer; position: relative; overflow: hidden; }
        .vote-card:hover { 
            transform: translateY(-15px) rotate(1deg);
            border-color: #ef4444;
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.5);
            background: rgba(239, 68, 68, 0.1);
        }
        
        .vote-card img { transition: all 0.6s ease; filter: grayscale(30%); }
        .vote-card:hover img { transform: scale(1.15) rotate(-2deg); filter: grayscale(0%) brightness(1.2); }

        .vote-card.selected { 
            border: 3px solid #ef4444; 
            background: rgba(239, 68, 68, 0.25);
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.8);
            transform: scale(1.05);
        }

        input {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
        }

        input:focus {
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
            border-color: #ef4444 !important;
            background: rgba(255, 255, 255, 0.1) !important;
        }

        #vote-btn {
            background: linear-gradient(45deg, #7f1d1d, #ef4444);
            border: 2px solid transparent;
        }

        #vote-btn:hover {
            letter-spacing: 5px;
            box-shadow: 0 0 40px #ef4444;
            transform: scale(1.1);
            border-color: #fff;
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            .metal-font { font-size: 3rem; }
            .vote-card { margin-bottom: 10px; }
        }
    </style>
</head>
<body class="p-4 md:p-10 animate__animated animate__fadeIn">

    <header class="max-w-5xl mx-auto text-center mb-12">
        <h1 class="metal-font text-5xl md:text-7xl text-red-600 mb-4 tracking-wider neon-text">MEMBERS VOTE</h1>
        <p class="text-xs md:text-sm tracking-[0.3em] md:tracking-[0.5em] uppercase text-gray-300 animate__animated animate__fadeInUp">Tentukan Identitas Deathbat Blitar Raya 2026</p>
    </header>

    <main class="max-w-6xl mx-auto">
        <!-- FORM DATA MEMBER -->
        <div class="max-w-md mx-auto mb-16 space-y-6 animate__animated animate__zoomIn">
            <div class="relative group">
                <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-red-600 transition-all group-focus-within:scale-125"></i>
                <input type="text" id="input-nama" placeholder="NAMA LENGKAP" 
                    class="w-full p-4 pl-12 rounded-xl outline-none transition-all placeholder-gray-500">
            </div>
            <div class="relative group">
                <i class="fas fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-red-600 transition-all group-focus-within:scale-125"></i>
                <input type="tel" id="input-hp" placeholder="NOMOR WHATSAPP" 
                    class="w-full p-4 pl-12 rounded-xl outline-none transition-all placeholder-gray-500">
            </div>
        </div>

        <!-- PILIHAN DESAIN -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- DESIGN 1 -->
            <div id="card-1" onclick="selectDesign(1)" class="ultra-glass vote-card rounded-[2rem] p-5 animate__animated animate__fadeInLeft">
                <img src="aset-gambar/produk-1.jpeg" alt="Design 1" class="w-full h-72 md:h-80 object-cover rounded-2xl mb-6">
                <h3 class="metal-font text-2xl text-red-500 text-center uppercase tracking-widest">Pink Version</h3>
            </div>
            <!-- DESIGN 2 -->
            <div id="card-2" onclick="selectDesign(2)" class="ultra-glass vote-card rounded-[2rem] p-5 animate__animated animate__fadeInUp">
                <img src="aset-gambar/produk-2.jpeg" alt="Design 2" class="w-full h-72 md:h-80 object-cover rounded-2xl mb-6">
                <h3 class="metal-font text-2xl text-red-500 text-center uppercase tracking-widest">Plat AG V1</h3>
            </div>
            <!-- DESIGN 3 -->
            <div id="card-3" onclick="selectDesign(3)" class="ultra-glass vote-card rounded-[2rem] p-5 animate__animated animate__fadeInRight">
                <img src="aset-gambar/produk-3.jpeg" alt="Design 3" class="w-full h-72 md:h-80 object-cover rounded-2xl mb-6">
                <h3 class="metal-font text-2xl text-red-500 text-center uppercase tracking-widest">Koi Version</h3>
            </div>
            <!-- DESIGN 5 (Geser ke posisi 4) -->
            <div id="card-5" onclick="selectDesign(5)" class="ultra-glass vote-card rounded-[2rem] p-5 animate__animated animate__fadeInLeft">
                <img src="aset-gambar/produk-5.jpeg" alt="Design 5" class="w-full h-72 md:h-80 object-cover rounded-2xl mb-6">
                <h3 class="metal-font text-2xl text-red-500 text-center uppercase tracking-widest">Blitar Art</h3>
            </div>
            <!-- DESIGN 6 (Sebelumnya Desain 4) -->
            <div id="card-6" onclick="selectDesign(6)" class="ultra-glass vote-card rounded-[2rem] p-5 animate__animated animate__fadeInRight">
                <img src="aset-gambar/produk-6.jpeg" alt="Design 6" class="w-full h-72 md:h-80 object-cover rounded-2xl mb-6">
                <h3 class="metal-font text-2xl text-red-500 text-center uppercase tracking-widest">Plat AG V2</h3>
            </div>
        </div>

        <div class="text-center mt-20 mb-20">
            <button id="vote-btn" onclick="submitVote()" 
                class="text-white font-black px-12 py-5 md:px-20 md:py-8 rounded-full transition-all duration-500 uppercase tracking-widest shadow-xl">
                KIRIM SUARA 🤘
            </button>
        </div>
    </main>

    <script>
        let selectedId = null;
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyesYqr-rmEGNXQOOlmctVccJYpjKYRpx20ZoMDCNO8uVrY5PV9pVelRRbV4SoM0lyHDw/exec"; 

        function selectDesign(id) {
            document.querySelectorAll('.vote-card').forEach(card => card.classList.remove('selected'));
            selectedId = id;
            const selectedCard = document.getElementById(`card-${id}`);
            selectedCard.classList.add('selected');
            
            // Efek haptik visual
            selectedCard.classList.add('animate__animated', 'animate__rubberBand');
            setTimeout(() => selectedCard.classList.remove('animate__rubberBand'), 1000);
        }

        async function submitVote() {
            const nama = document.getElementById('input-nama').value;
            const hp = document.getElementById('input-hp').value;
            const btn = document.getElementById('vote-btn');

            if(!selectedId || !nama || !hp) {
                alert("Woi! Isi datanya dulu dan pilih desainnya! 🔥");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = "<i class='fas fa-skull fa-spin'></i> MENGIRIM...";

            const payload = {
                nama: nama,
                hp: hp,
                pilihan: "Desain " + selectedId
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'application/json' }
                });
                
                alert("SUARA BERHASIL DISIMPAN! A7X FOREVER! 🤘");
                btn.innerHTML = "BERHASIL ✅";
                btn.style.background = "#059669";
            } catch (error) {
                alert("Error lur! Coba cek koneksi internetmu.");
                btn.disabled = false;
                btn.innerHTML = "KIRIM SUARA 🤘";
            }
        }
    </script>
</body>
</html>
