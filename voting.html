<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Seragam - Deathbat Blitar Raya</title>

    <!-- SEO & SHARE LINK OPTIMIZATION -->
    <meta property="og:title" content="Voting Seragam Deathbat Blitar Raya">
    <meta property="og:description" content="Tentukan seragam resmi komunitas kita untuk tahun 2026!">
    <meta property="og:image" content="a7xblitar.png"> 
    <meta property="og:url" content="https://website-anda.com">
    <meta name="theme-color" content="#ef4444">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), url('a7x-bg.jpg');
            background-attachment: fixed;
            background-size: cover;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .metal-font { font-family: 'Metal Mania', cursive; }
        
        .neon-text {
            text-shadow: 0 0 10px #ef4444, 0 0 20px #ef4444, 0 0 30px #7f1d1d;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .ultra-glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
        }

        .vote-card { cursor: pointer; position: relative; overflow: hidden; }
        .vote-card:hover { 
            transform: translateY(-10px) scale(1.02);
            border-color: #ef4444;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
            background: rgba(239, 68, 68, 0.05);
        }
        
        .vote-card img { transition: all 0.5s ease; }
        .vote-card:hover img { transform: scale(1.1); filter: brightness(1.1); }

        .vote-card.selected { 
            border: 2px solid #ef4444; 
            background: rgba(239, 68, 68, 0.2);
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.6);
        }

        input:focus {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
            background: rgba(255,255,255,0.1) !important;
        }

        #vote-btn:hover {
            letter-spacing: 3px;
            box-shadow: 0 0 30px #ef4444;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="p-4 md:p-10 animate__animated animate__fadeIn">

    <header class="max-w-5xl mx-auto text-center mb-12">
        <h1 class="metal-font text-5xl md:text-7xl text-red-600 mb-4 tracking-wider neon-text">MEMBER'S VOTE</h1>
        <p class="text-xs tracking-[0.4em] uppercase text-gray-400 animate__animated animate__fadeInUp">Pilih Seragam Resmi Deathbat Blitar Raya 2026</p>
    </header>

    <main class="max-w-6xl mx-auto">
        <!-- FORM DATA MEMBER -->
        <div class="max-w-md mx-auto mb-16 space-y-6 animate__animated animate__fadeInUp">
            <div class="relative group">
                <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-red-600 transition-all group-focus-within:scale-125"></i>
                <input type="text" id="input-nama" placeholder="NAMA LENGKAP" 
                    class="w-full bg-white/5 border border-white/10 p-4 pl-12 rounded-xl outline-none transition-all">
            </div>
            <div class="relative group">
                <i class="fas fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-red-600 transition-all group-focus-within:scale-125"></i>
                <input type="tel" id="input-hp" placeholder="NOMOR WHATSAPP" 
                    class="w-full bg-white/5 border border-white/10 p-4 pl-12 rounded-xl outline-none transition-all">
            </div>
        </div>

        <!-- PILIHAN DESAIN -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <!-- DESIGN 1 -->
            <div id="card-1" onclick="selectDesign(1)" class="ultra-glass vote-card rounded-[2rem] p-6 animate__animated animate__fadeInLeft">
                <img src="aset-gambar/produk-1.jpeg" alt="Design 1" class="w-full h-80 object-cover rounded-2xl mb-6">
                <h3 class="metal-font text-2xl text-red-500 text-center uppercase">Pink Version</h3>
            </div>
            <!-- DESIGN 2 -->
            <div id="card-2" onclick="selectDesign(2)" class="ultra-glass vote-card rounded-[2rem] p-6 animate__animated animate__fadeInUp">
                <img src="aset-gambar/produk-2.jpeg" alt="Design 2" class="w-full h-80 object-cover rounded-2xl mb-6">
                <h3 class="metal-font text-2xl text-red-500 text-center uppercase">Plat AG V1</h3>
            </div>
            <!-- DESIGN 3 -->
            <div id="card-3" onclick="selectDesign(3)" class="ultra-glass vote-card rounded-[2rem] p-6 animate__animated animate__fadeInRight">
                <img src="aset-gambar/produk-3.jpeg" alt="Design 3" class="w-full h-80 object-cover rounded-2xl mb-6">
                <h3 class="metal-font text-2xl text-red-500 text-center uppercase">Blitar Koi Version</h3>
            </div>
            <!-- DESIGN 4 -->
            <div id="card-4" onclick="selectDesign(4)" class="ultra-glass vote-card rounded-[2rem] p-6 animate__animated animate__fadeInLeft">
                <img src="aset-gambar/produk-4.jpeg" alt="Design 4" class="w-full h-80 object-cover rounded-2xl mb-6">
                <h3 class="metal-font text-2xl text-red-500 text-center uppercase">Blitar Art Version</h3>
            </div>
            <!-- DESIGN 5 -->
            <div id="card-5" onclick="selectDesign(5)" class="ultra-glass vote-card rounded-[2rem] p-6 animate__animated animate__fadeInRight">
                <img src="aset-gambar/produk-5.jpeg" alt="Design 5" class="w-full h-80 object-cover rounded-2xl mb-6">
                <h3 class="metal-font text-2xl text-red-500 text-center uppercase">Plat AG V2</h3>
            </div>
        </div>

        <div class="text-center mt-20 mb-20">
            <button id="vote-btn" onclick="submitVote()" 
                class="bg-red-600 text-white font-black px-16 py-6 rounded-full transition-all duration-500 uppercase tracking-widest shadow-[0_0_30px_rgba(239,68,68,0.3)]">
                KIRIM SUARA 🤘
            </button>
        </div>
    </main>

    <script>
        let selectedId = null;
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxK4JA9U_0wBCv8wtnpSaefSr6eUckVAW0bbTd5KatNCJYUHKfRgRLsnPLH8Hm9ekFCKw/exec"; 

        function selectDesign(id) {
            document.querySelectorAll('.vote-card').forEach(card => card.classList.remove('selected'));
            selectedId = id;
            const selectedCard = document.getElementById(`card-${id}`);
            selectedCard.classList.add('selected');
            selectedCard.classList.add('animate__animated', 'animate__pulse');
            setTimeout(() => selectedCard.classList.remove('animate__pulse'), 500);
        }

        async function submitVote() {
            const nama = document.getElementById('input-nama').value;
            const hp = document.getElementById('input-hp').value;
            const btn = document.getElementById('vote-btn');

            if(!selectedId || !nama || !hp) {
                alert("LENGKAPI DATA DAN PILIH DESAIN! 🔥");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> MENGIRIM...";

            const payload = {
                nama: nama,
                hp: hp,
                pilihan: "Desain " + selectedId
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'application/json' }
                });
                
                alert("SUARA BERHASIL DISIMPAN! A7X FOREVER! 🤘");
                btn.innerHTML = "BERHASIL ✅";
                btn.className = "bg-green-600 text-white font-black px-16 py-6 rounded-full transition-all duration-500";
            } catch (error) {
                alert("Terjadi kesalahan. Coba lagi nanti!");
                btn.disabled = false;
                btn.innerHTML = "KIRIM SUARA 🤘";
            }
        }
    </script>
</body>
</html>
