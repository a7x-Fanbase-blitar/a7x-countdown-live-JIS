<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A7X BLITAR | EXCLUSIVE VIP PASS - DINAMIS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030303;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px; 
            overflow: hidden;
        }

        .vip-card-container {
            position: relative;
            width: 550px;   
            height: 320px;  
            transform-style: preserve-3d;
            animation: flagWaveLarge 7s ease-in-out infinite alternate;
        }

        @keyframes flagWaveLarge {
            0% {
                transform: rotateX(12deg) rotateY(-18deg) skewX(3deg) translateY(0px);
                box-shadow: -25px 30px 45px rgba(0, 0, 0, 0.95), 15px -15px 35px rgba(255, 0, 0, 0.07);
            }
            50% {
                transform: rotateX(6deg) rotateY(0deg) skewX(-3deg) translateY(-8px);
                box-shadow: -10px 20px 50px rgba(0, 0, 0, 0.9), 0px 0px 40px rgba(255, 0, 0, 0.15);
            }
            100% {
                transform: rotateX(14deg) rotateY(18deg) skewX(2deg) translateY(8px);
                box-shadow: 25px 35px 45px rgba(0, 0, 0, 0.95), -15px 15px 35px rgba(255, 0, 0, 0.07);
            }
        }

        .vip-card {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #070707 0%, #151515 50%, #040404 100%);
            border-radius: 20px; 
            padding: 30px;      
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 2px solid #1c1c1c;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.95);
        }

        .vip-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent 42%, rgba(255, 255, 255, 0.12) 50%, transparent 58%);
            mix-blend-mode: overlay;
            animation: chromeShimmer 6s linear infinite;
        }

        @keyframes chromeShimmer {
            0% { transform: translate(-30%, -30%); }
            100% { transform: translate(30%, 30%); }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        .logo-a7x-blitar {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-img {
            width: 55px; 
            height: auto;
            filter: drop-shadow(0 0 8px #ff0000);
        }
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.1rem; 
            color: #ffffff;
            letter-spacing: 1.5px;
            text-shadow: 0 0 5px #000;
        }

        .vip-badge {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.95rem;
            color: #ffcc00;
            border: 1px solid rgba(255, 204, 0, 0.5);
            background: rgba(255, 204, 0, 0.07);
            padding: 6px 18px;
            border-radius: 20px;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.15);
        }

        .card-body {
            margin-top: auto;
            margin-bottom: auto;
            padding-left: 5px;
            z-index: 2;
        }
        
        @keyframes movingRainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .member-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.6rem; 
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff0000, #ff8000, #ffff00, #00ff00, #00ffff, #0000ff, #8000ff, #ff00ff, #ff0000);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: movingRainbow 4s linear infinite;
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.9));
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            padding-top: 15px;
            z-index: 2;
        }

        .meta-box .label {
            font-size: 0.75rem;
            color: #555;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .meta-box .value {
            font-size: 1.15rem;
            color: #e0e0e0;
            font-weight: 700;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 0.5px;
        }
        
        .id-value {
            color: #ff0000 !important;
            font-family: 'Orbitron', sans-serif !important;
            font-size: 1.1rem !important;
            font-weight: 900 !important;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.4);
        }

        .card-watermark {
            position: absolute;
            right: 0px;
            bottom: -30px;
            font-size: 16rem; 
            color: rgba(255, 0, 0, 0.015);
            font-family: 'Metal Mania', cursive;
            user-select: none;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="vip-card-container">
        <div class="vip-card">
            <div class="card-watermark">☠</div>
            
            <div class="card-header">
                <div class="logo-a7x-blitar">
                    <img src="logo.png" alt="A7X" class="logo-img" onerror="this.style.display='none'">
                    <span class="logo-text">A7X BLITAR</span>
                </div>
                <div class="vip-badge">VIP PASS</div>
            </div>
            
            <!-- Default teks jika parameter link kosong -->
            <div class="card-body">
                <div class="member-name" id="card-name">GUEST_MEMBER</div>
            </div>
            
            <div class="card-footer">
                <div class="meta-box">
                    <div class="label">Status Kategori</div>
                    <div class="value" id="card-status" style="color: #ffcc00;">VIP MEMBER</div>
                </div>
                <div class="meta-box" style="text-align: right;">
                    <div class="label">MEMBER ID</div>
                    <div class="value id-value" id="card-id">DBR-000000</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- LOGIKA UTAMA MEMBACA URL PARAMETER ---
        function getCardParameters() {
            var urlParams = new URLSearchParams(window.location.search);
            
            // Mengambil nilai dari ?nama=... &id=... &status=...
            var nameParam = urlParams.get('nama');
            var idParam = urlParams.get('id');
            var statusParam = urlParams.get('status');

            // 1. Ganti Nama
            if (nameParam) {
                // Mengubah tanda underscore (_) atau %20 menjadi spasi agar rapi di kartu
                document.getElementById('card-name').innerText = nameParam.replace(/_/g, ' ');
            }

            // 2. Ganti ID Member
            if (idParam) {
                document.getElementById('card-id').innerText = idParam.toUpperCase();
            }

            // 3. Ganti Status Kategori (Opsional)
            if (statusParam) {
                document.getElementById('card-status').innerText = statusParam.replace(/_/g, ' ').toUpperCase();
            }
        }

        // Jalankan fungsi pembaca link saat halaman selesai dimuat
        window.onload = getCardParameters;
    </script>

</body>
</html>
