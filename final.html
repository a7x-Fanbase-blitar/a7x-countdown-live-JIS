<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deathbat Design Showdown - A7X Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        :root {
            --fire-color: #ff4500;
            --fire-light: #ffba08;
            --dark-red: #800000;
        }

        /* --- GLOBAL FIX UNTUK RESPONSIVE --- */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: #050100;
            color: #e0e0e0;
            font-family: 'Metal Mania', cursive;
            min-height: 100vh;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* --- GATEKEEPER / INTRO SCREEN --- */
        #gatekeeper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #2a0800 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1.5s ease-out, transform 1.5s ease-out;
        }

        .enter-btn {
            background: transparent;
            color: var(--fire-light);
            border: 2px solid var(--fire-color);
            padding: 20px 50px;
            font-size: 3rem;
            font-family: 'Metal Mania', cursive;
            cursor: pointer;
            text-align: center;
            text-shadow: 0 0 20px var(--fire-color);
            box-shadow: 0 0 30px rgba(255, 69, 0, 0.5), inset 0 0 20px rgba(255, 69, 0, 0.5);
            transition: 0.3s;
            border-radius: 10px;
            animation: pulse-fire 1.5s infinite alternate;
        }

        .enter-btn:hover {
            background: rgba(255, 69, 0, 0.2);
            transform: scale(1.1);
            color: #fff;
        }

        /* --- BACKGROUND UTAMA --- */
        #main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)), 
                        url('wood.jpg!d');
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            padding-bottom: 50px;
            position: relative;
            z-index: 1;
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            pointer-events: none;
            z-index: 0;
        }

        h1 {
            margin-top: 50px;
            font-size: 4rem;
            color: #fff;
            text-shadow: 0 0 20px #ff0000, 5px 5px 0 #000;
            letter-spacing: 5px;
            text-align: center;
            animation: flicker 2s infinite, slideDown 1s ease-out forwards;
            z-index: 10;
            padding: 0 15px;
        }

        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulse-fire { 0% { box-shadow: 0 0 20px #ff4500; } 100% { box-shadow: 0 0 50px #ffba08; } }

        /* Form Input Section */
        .voter-info {
            background: rgba(10, 0, 0, 0.9);
            border: 2px solid var(--dark-red);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
            position: relative;
            z-index: 20;
            animation: slideUp 1.2s ease-out forwards;
            text-align: center;
        }

        .voter-info input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #000;
            border: 1px solid var(--fire-color);
            color: #fff;
            font-family: 'Permanent Marker', cursive;
            border-radius: 4px;
            transition: 0.3s;
        }

        .voter-info input:focus {
            outline: none;
            box-shadow: 0 0 15px var(--fire-color);
            background: #111;
        }

        .showdown-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 95%;
            max-width: 1200px;
            position: relative;
            z-index: 10;
            animation: slideUp 1.5s ease-out forwards;
        }

        .design-card {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #444;
            padding: 15px;
            text-align: center;
            flex: 1;
            width: 100%;
            transition: 0.5s;
            clip-path: polygon(0% 0%, 100% 0%, 100% 90%, 50% 100%, 0% 90%);
        }

        .design-card:hover {
            transform: translateY(-10px) scale(1.05);
            border-color: var(--fire-color);
            box-shadow: 0 15px 40px rgba(255, 69, 0, 0.6);
        }

        .design-image { width: 100%; border: 1px solid #222; margin-bottom: 15px; border-radius: 5px; }

        /* --- VS 3D --- */
        .vs-wrapper {
            position: relative;
            width: 250px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 15;
            flex-shrink: 0;
        }

        .vs-image-3d {
            width: 100%;
            max-width: 220px;
            animation: floatVS 2s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255, 69, 0, 0.8));
        }

        @keyframes floatVS {
            0% { transform: translateY(0px) scale(1); filter: drop-shadow(0 0 20px rgba(255, 69, 0, 0.5)); }
            50% { transform: translateY(-15px) scale(1.1); filter: drop-shadow(0 0 50px rgba(255, 186, 8, 1)); }
            100% { transform: translateY(0px) scale(1); filter: drop-shadow(0 0 20px rgba(255, 69, 0, 0.5)); }
        }

        .vote-btn {
            background: linear-gradient(to bottom, #800000, #300000);
            color: #fff;
            border: 1px solid #ff0000;
            padding: 15px 0;
            width: 100%;
            font-family: 'Metal Mania', cursive;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            border-radius: 5px;
        }

        .vote-btn:hover:not(:disabled) {
            background: linear-gradient(to bottom, #ff0000, #800000);
            letter-spacing: 5px;
            box-shadow: 0 0 30px #ff0000;
        }

        .vote-btn:disabled { background: #222; border-color: #555; color: #777; cursor: not-allowed; }

        #status-msg { margin: 20px; font-family: 'Permanent Marker', cursive; color: #00ff00; display: none; font-size: 1.5rem; z-index: 20; text-shadow: 0 0 10px #00ff00; text-align: center;}

        /* =========================================
           PENGATURAN RESPONSIVE UNTUK LAYAR HP
           ========================================= */
        @media screen and (max-width: 768px) {
            .enter-btn {
                font-size: 1.8rem;
                padding: 15px 30px;
                width: 80%;
            }

            h1 { 
                font-size: 2.2rem; 
                letter-spacing: 2px;
                margin-top: 30px;
            }

            .showdown-container { 
                flex-direction: column; 
                gap: 10px;
            }

            .voter-info {
                padding: 15px;
                width: 95%;
            }

            .voter-info label {
                font-size: 1rem !important;
            }

            /* Mengecilkan Logo VS agar pas di tengah versi vertikal */
            .vs-wrapper { 
                height: 150px; 
                width: 150px;
                margin: 5px 0; 
            }

            .vs-image-3d {
                max-width: 120px;
            }

            .design-card {
                clip-path: none; /* Menghilangkan bentuk potongan agar lebih rapi di HP */
                border-radius: 10px;
                padding: 10px;
            }

            .design-card h3 {
                font-size: 1.5rem !important;
            }
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="https://raw.githubusercontent.com/a7x-Fanbase-blitar/aset-music/main/Avenged_Sevenfold_-_Remenissions.mp3" type="audio/mpeg">
    </audio>

    <div id="gatekeeper">
        <button class="enter-btn" onclick="enterTheFire()">VOTING PILIHAN MU </button>
    </div>

    <div id="main-content">
        <div id="particles-js"></div>

        <h1>DEATHBAT SHOWDOWN</h1>

        <div class="voter-info">
            <label style="font-size: 1.2rem; text-shadow: 0 0 5px red; display: block; margin-bottom: 10px;">MASUKKAN IDENTITASMU !</label>
            <input type="text" id="nama" placeholder="NAMA LENGKAP..." required>
            <input type="number" id="wa" placeholder="NOMOR WHATSAPP (CONTOH: 0812...)" required>
        </div>

        <div class="showdown-container">
            <div class="design-card">
                <h3 style="font-size: 2rem; margin: 5px 0;">DESIGN A</h3>
                <img src="desainA.jpeg" alt="Design A" class="design-image">
                <button class="vote-btn" onclick="submitVote('Design A')">VOTE A</button>
            </div>

            <div class="vs-wrapper">
                <img src="api.png" alt="VS" class="vs-image-3d">
            </div>

            <div class="design-card">
                <h3 style="font-size: 2rem; margin: 5px 0;">DESIGN B</h3>
                <img src="desainB.jpeg" alt="Design B" class="design-image">
                <button class="vote-btn" onclick="submitVote('Design B')">VOTE B</button>
            </div>
        </div>

        <div id="status-msg">VOTE BERHASIL! WELCOME TO THE FAMILY! \m/</div>
    </div>

    <script>
        // 1. Logika Gatekeeper & Play Music
        function enterTheFire() {
            const gate = document.getElementById('gatekeeper');
            const main = document.getElementById('main-content');
            const music = document.getElementById('bg-music');

            // Coba mainkan musik
            music.volume = 0.6; // Set volume 60%
            music.play().catch(e => console.log("Musik diblokir browser, abaikan saja."));

            // Animasi transisi layar
            gate.style.transform = 'scale(1.5)';
            gate.style.opacity = '0';
            
            setTimeout(() => {
                gate.style.display = 'none';
                main.style.display = 'flex';
                createFireParticles(); // Mulai hujanan api
            }, 1000);
        }

        // 2. Generator Partikel Api (Embers) Penuh di Layar
        function createFireParticles() {
            const container = document.getElementById('particles-js');
            const particleCount = 40; // Kurangi sedikit agar ringan di HP

            for (let i = 0; i < particleCount; i++) {
                let particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.bottom = '-10px';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.width = Math.random() * 5 + 2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.background = '#ffba08';
                particle.style.borderRadius = '50%';
                particle.style.boxShadow = '0 0 10px #ff4500, 0 0 20px #ff0000';
                particle.style.opacity = Math.random();
                
                // Durasi & Delay acak
                let duration = Math.random() * 3 + 2; 
                let delay = Math.random() * 5;
                
                particle.style.animation = `flyUp ${duration}s linear ${delay}s infinite`;
                container.appendChild(particle);
            }
        }

        // Keyframe untuk partikel dimasukkan lewat JS agar dinamis
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes flyUp {
                0% { transform: translateY(0) scale(1); opacity: 1; }
                100% { transform: translateY(-100vh) scale(0); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // 3. Logika Voting (Google Sheets)
        const scriptURL = 'https://script.google.com/macros/s/AKfycbySGV4Pzmlqk0aUcj11cDnzvMChop3eg0G_6eE_TLiJ-tMVHUX6C7fmAhuIuaN08ABaog/exec'; // JANGAN LUPA GANTI INI!

        function submitVote(pilihan) {
            const nama = document.getElementById('nama').value;
            const wa = document.getElementById('wa').value;

            if (!nama || !wa) {
                alert("Isi Nama dan No WA dulu, Brother! Tunjukkan identitasmu!");
                return;
            }

            const btns = document.querySelectorAll('.vote-btn');
            btns.forEach(b => {
                b.disabled = true;
                b.innerText = "MENGIRIM...";
            });
            
            const formData = new URLSearchParams();
            formData.append('nama', nama);
            formData.append('wa', wa);
            formData.append('pilihan', pilihan);

            fetch(scriptURL, { method: 'POST', body: formData })
            .then(res => {
                document.getElementById('status-msg').style.display = 'block';
                document.querySelector('.voter-info').style.opacity = '0.3';
                btns.forEach(b => {
                    b.innerText = 'VOTED \m/';
                    b.style.background = "#111";
                });
            })
            .catch(err => {
                alert("Gagal mengirim vote. Server sedang headbang, coba lagi!");
                btns.forEach(b => {
                    b.disabled = false;
                    b.innerText = "COBA LAGI";
                });
            });
        }
    </script>
</body>
</html>
