    let user = { name: "", email: "" };
    let curIdx = 0;
    let score = 0;
    let timer;
    let timeLeft = 100;
    let activeQuestions = [];
    let currentMode = "trivia"; // 'trivia' atau 'lyric'
    let pointPerQuestion = 10;

    window.onload = fetchLeaderboard;

    function showView(id) {
        document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function checkDailyLimit(mode) {
        const n = document.getElementById('username').value;
        const e = document.getElementById('useremail').value;
        if(!n || !e) return alert("Identify yourself!");
        
        const today = new Date().toLocaleDateString();
        // Limit harian dicek berdasarkan mode spesifik
        if(localStorage.getItem(`a7x_daily_${mode}_${e}`) === today) {
            return alert(`Mission [${mode.toUpperCase()}] already completed today!`);
        }

        currentMode = mode;
        let selectedDb = [];
        let storageKey = "";

        if(mode === "trivia") {
            selectedDb = database50;
            pointPerQuestion = 10;
            storageKey = `a7x_used_q_${e}`;
            document.getElementById('main-panel').classList.remove('lyric-mode');
        } else {
            selectedDb = databaseLyrics60;
            pointPerQuestion = 20;
            storageKey = `a7x_used_lyric_${e}`;
            // Tambahkan class penanda lirik untuk kustomisasi visual bertema emas
            document.getElementById('main-panel').classList.add('lyric-mode');
        }

        let usedIds = JSON.parse(localStorage.getItem(storageKey)) || [];
        let available = selectedDb.filter(q => !usedIds.includes(q.id));
        
        // Reset siklus jika soal habis
        if(available.length < 10) {
            alert(`All ${mode} mission packs completed! Resetting question cycle.`);
            usedIds = [];
            available = [...selectedDb];
        }

        user = { name: n, email: e };
        const shuffled = available.sort(() => Math.random() - 0.5);
        activeQuestions = shuffled.slice(0, 10);
        
        const currentIds = activeQuestions.map(q => q.id);
        localStorage.setItem(storageKey, JSON.stringify([...usedIds, ...currentIds]));

        showView('view-quiz');
        // Sesuaikan warna bar timer berdasarkan mode (Merah untuk Trivia, Emas untuk Lirik)
        document.getElementById('timer-bar').style.background = mode === 'trivia' ? 'var(--neon-red)' : 'var(--gold)';
        loadQuestion();
    }

    function loadQuestion() {
        if(curIdx >= 10) return endQuiz();
        clearInterval(timer);
        timeLeft = 100;
        const data = activeQuestions[curIdx];
        
        const modeLabel = currentMode === "trivia" ? "TRIVIA" : "LYRICS";
        document.getElementById('q-count').innerText = `${modeLabel} QUEST ${curIdx + 1}/10`;
        document.getElementById('q-text').innerText = data.q;
        
        const box = document.getElementById('options-box');
        box.innerHTML = '';
        
        data.a.forEach((opt, i) => {
            const d = document.createElement('div');
            d.className = 'option-card';
            d.innerText = opt;
            d.onclick = () => handleAnswer(i);
            box.appendChild(d);
        });
        
        timer = setInterval(() => {
            timeLeft -= 1.1;
            document.getElementById('timer-bar').style.width = timeLeft + "%";
            if(timeLeft <= 0) handleAnswer(-1);
        }, 100);
    }

    function handleAnswer(idx) {
        if(idx === activeQuestions[curIdx].c) {
            score += pointPerQuestion;
            document.getElementById('q-score').innerText = `XP: ${score}`;
        }
        curIdx++;
        loadQuestion();
    }

    function endQuiz() {
        clearInterval(timer);
        showView('view-result');
        
        const finalPtsElement = document.getElementById('final-points');
        finalPtsElement.innerText = score;
        
        if(currentMode === "lyric") {
            finalPtsElement.style.color = "var(--gold)";
            document.getElementById('result-header').innerText = "LYRIC MISSION ACCOMPLISHED";
        } else {
            finalPtsElement.style.color = "var(--neon-red)";
            document.getElementById('result-header').innerText = "MISSION ACCOMPLISHED";
        }

        localStorage.setItem(`a7x_daily_${currentMode}_${user.email}`, new Date().toLocaleDateString());
        submitScore();
    }

    async function submitScore() {
        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ user: user.name, email: user.email, score: score })
            });
            document.getElementById('sync-status').innerText = "XP DATA SYNCHRONIZED TO YOUR ACCOUNT";
            fetchLeaderboard();
        } catch(e) { console.log(e); }
    }

    async function fetchLeaderboard() {
        const target = document.getElementById('leaderboard-list');
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            data.sort((a,b) => b[2] - a[2]);
            target.innerHTML = data.slice(0, 10).map((row, i) => `
                <div class="leader-item">
                    <span><strong style="color:var(--gold)">#${i+1}</strong> ${row[0]}</span>
                    <span style="color:var(--neon-red); font-family:'Orbitron'; font-weight:bold;">${row[2]} XP</span>
                </div>
            `).join('');
        } catch(e) { target.innerHTML = "<p style='color:#333; text-align:center;'>Database Offline.</p>"; }
    }
</script>
