<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A7X BLITAR | TRIVIA SYSTEM v3.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Metal+Mania&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-red: #ff0000;
            --dark-red: #8b0000;
            --panel-bg: rgba(0, 0, 0, 0.92);
            --border-glow: 1px solid rgba(255, 0, 0, 0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0a0a0a;
            background-image: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.9)), url('wood.jpg!d');
            background-size: cover;
            background-attachment: fixed;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        header { padding: 45px 20px; text-align: center; }
        .glitch-text { font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 900; text-shadow: 0 0 10px var(--neon-red); animation: shadow-glitch 2s infinite; text-transform: uppercase; }
        @keyframes shadow-glitch { 0% { text-shadow: 3px 3px var(--neon-red), -3px -3px #000; } 50% { text-shadow: -3px 3px var(--neon-red), 3px -3px #444; } 100% { text-shadow: 3px -3px var(--neon-red), -3px 3px #000; } }
        .metal-subtitle { font-family: 'Metal Mania', cursive; color: var(--neon-red); font-size: 1.6rem; letter-spacing: 5px; margin-top: -10px; text-transform: uppercase; }
        .main-container { display: grid; grid-template-columns: 1fr 1.6fr; gap: 30px; width: 95%; max-width: 1300px; margin: 0 auto 50px auto; }
        .panel { background: var(--panel-bg); border: var(--border-glow); border-radius: 20px; padding: clamp(20px, 5vw, 35px); backdrop-filter: blur(15px); box-shadow: 0 10px 40px rgba(0,0,0,0.7); height: fit-content; }
        .panel-header { font-family: 'Orbitron', sans-serif; color: var(--neon-red); font-size: 1.1rem; margin-bottom: 25px; border-left: 5px solid var(--neon-red); padding-left: 15px; }
        .btn-metal { width: 100%; padding: 18px; background: linear-gradient(45deg, #8b0000, #ff0000); color: #fff; border: none; border-radius: 12px; font-family: 'Orbitron', sans-serif; font-weight: 900; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-metal:hover { transform: translateY(-2px); box-shadow: 0 0 25px var(--neon-red); }
        .btn-redeem { background: transparent; border: 2px solid gold; color: gold; padding: 15px; width: 100%; border-radius: 12px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; margin-top: 15px; }
        .btn-redeem:hover { background: gold; color: black; }
        .leader-item { display: flex; justify-content: space-between; padding: 12px 18px; background: rgba(255,255,255,0.03); margin-bottom: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .option-card { background: rgba(255,255,255,0.04); border: 1px solid #222; padding: 20px; border-radius: 12px; margin-bottom: 12px; cursor: pointer; transition: 0.2s; }
        .option-card:hover { border-color: var(--neon-red); background: rgba(255,0,0,0.15); transform: translateX(5px); }
        #timer-wrap { width: 100%; height: 5px; background: #111; margin: 20px 0; border-radius: 10px; overflow: hidden; }
        #timer-bar { width: 100%; height: 100%; background: var(--neon-red); transition: width 0.1s linear; }
        input { width: 100%; padding: 18px; margin-bottom: 15px; background: #0a0a0a; border: 1px solid #333; color: white; border-radius: 12px; font-family: inherit; }
        section { display: none; }
        section.active { display: block; }
        @media (max-width: 1000px) { .main-container { grid-template-columns: 1fr; } .main-container aside { order: 2; } .main-container main { order: 1; } }
    </style>
</head>
<body>

<header>
    <h1 class="glitch-text">A7X BLITAR</h1>
    <p class="metal-subtitle">Deathbat Nation Quiz</p>
</header>

<div class="main-container">
    <aside class="panel">
        <h3 class="panel-header">LEADERBOARD</h3>
        <div id="leaderboard-list"><p style="color:#444; text-align: center;">Fetching souls...</p></div>
        <div style="margin-top: 30px; border-top: 1px solid #222; padding-top: 20px;">
            <h3 class="panel-header" style="color: gold; border-color: gold; font-size: 0.9rem;">ELITE REWARDS</h3>
            <button class="btn-redeem" onclick="window.location.href='redem.html'">REDEEM XP POINTS</button>
        </div>
    </aside>

    <main class="panel">
        <section id="view-gate" class="active">
            <h3 class="panel-header">GATEKEEPER ACCESS</h3>
            <p style="font-size: 0.9rem; color:#666; margin-bottom: 20px;">Mission: 10 Unique Questions / Day.</p>
            <input type="text" id="username" placeholder="NAMA / NICKNAME">
            <input type="email" id="useremail" placeholder="EMAIL TERDAFTAR">
            <button class="btn-metal" onclick="checkDailyLimit()">START DAILY MISSION</button>
        </section>

        <section id="view-quiz">
            <div style="display: flex; justify-content: space-between; font-family: 'Orbitron'; font-size: 0.75rem; color: #555;">
                <span id="q-count">QUEST 01/10</span>
                <span id="q-score" style="color: gold;">XP: 0</span>
            </div>
            <div id="timer-wrap"><div id="timer-bar"></div></div>
            <h2 id="q-text" style="font-size: 1.5rem; margin-bottom: 25px; line-height: 1.4;">...</h2>
            <div id="options-box"></div>
        </section>

        <section id="view-result">
            <h3 class="panel-header">MISSION ACCOMPLISHED</h3>
            <div style="text-align: center; padding: 25px 0;">
                <h1 id="final-points" style="font-size: 5.5rem; color: var(--neon-red);">0</h1>
                <p id="sync-status" style="color: #00ff00; font-size: 0.85rem; margin-bottom: 35px;">DATA SYNCHRONIZED</p>
                <button class="btn-metal" onclick="location.reload()">DASHBOARD</button>
            </div>
        </section>
    </main>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzvFAVo9rxkc9i_x86NR_TFSp_pG2ZIAUBCcUW5okBAa49Uq2dAb5pWbBwJW9mfnCRyfg/exec'; 

    const database50 = [
        { id: 1, q: "Siapa vokalis band 'Successful Failure', proyek sampingan personil A7X di masa lalu?", a: ["M. Shadows", "The Rev", "Zacky Vengeance", "Johnny Christ"], c: 2 },
        { id: 2, q: "Lagu 'Save Me' memiliki durasi 10:57. Apa 'working title' lagu ini saat proses demo?", a: ["L-7", "The Bridge", "Fiction", "Victim"], c: 0 },
        { id: 3, q: "Di kota mana Avenged Sevenfold memainkan konser pertama mereka di luar Amerika Serikat?", a: ["London", "Tokyo", "Vancouver", "Mexico City"], c: 2 },
        { id: 4, q: "Lagu 'Exist' menampilkan monolog naratif di bagian akhir. Siapa tokoh yang mengisi suara tersebut?", a: ["Neil deGrasse Tyson", "Stephen Hawking", "Carl Sagan", "Elon Musk"], c: 0 },
        { id: 5, q: "Siapa drummer yang melakukan sesi rekaman penuh untuk album 'Sounding the Seventh Trumpet'?", a: ["The Rev", "Matt Wendt", "Arin Ilejay", "Brooks Wackerman"], c: 0 },
        { id: 6, q: "Apa nama teknik drum 'Double-Ride' ikonik yang diciptakan oleh The Rev?", a: ["The Double-Ride Thing", "The Octopus Stroke", "Spider Chops", "The Rev Beat"], c: 0 },
        { id: 7, q: "Zacky Vengeance membentuk brand pakaian bernama Vengeance University. Tahun berapa brand ini berdiri?", a: ["2005", "2007", "2004", "2006"], c: 0 },
        { id: 8, q: "Lagu 'Afterlife' menampilkan elemen string section. Siapa yang menulis aransemen orkestranya?", a: ["The Rev", "Synyster Gates", "Brian Haner Sr.", "Marc Klasfeld"], c: 0 },
        { id: 9, q: "Apa instrumen pertama yang dipelajari Johnny Christ sebelum akhirnya berpindah ke Bass?", a: ["Gitar", "Piano", "Seksafon", "Drum"], c: 0 },
        { id: 10, q: "Lagu 'Not Ready to Die' dibuat khusus untuk game Call of Duty: Black Ops. Map apa yang dimaksud?", a: ["Call of the Dead", "Origins", "Mob of the Dead", "Moon"], c: 0 },
        { id: 11, q: "Apa judul lagu pertama yang pernah ditulis oleh The Rev untuk Avenged Sevenfold?", a: ["Fiction", "A Little Piece of Heaven", "Warmness on the Soul", "Shattered by Broken Dreams"], c: 3 },
        { id: 12, q: "Album 'City of Evil' menduduki posisi berapa di Billboard 200 pada minggu pertamanya?", a: ["30", "15", "42", "21"], c: 0 },
        { id: 13, q: "Siapa musisi yang memberikan teknik vokal 'Grit' kepada M. Shadows setelah operasi pita suara?", a: ["Ron Anderson", "Melissa Cross", "Axl Rose", "Chris Cornell"], c: 0 },
        { id: 14, q: "Di video klip 'Seize the Day', siapa personil yang diceritakan masuk penjara?", a: ["M. Shadows", "Zacky Vengeance", "Johnny Christ", "The Rev"], c: 0 },
        { id: 15, q: "Apa nama label rekaman pertama yang merilis debut album A7X?", a: ["Good Life Recordings", "Hopeless Records", "Warner Bros", "Capitol Records"], c: 0 },
        { id: 16, q: "Lagu 'Sidewinder' memiliki outro gitar akustik yang kental dengan nuansa?", a: ["Flamenco", "Country", "Blues", "Gypsy Jazz"], c: 0 },
        { id: 17, q: "Brooks Wackerman resmi bergabung tahun 2015. Dari band mana ia berasal sebelumnya?", a: ["Bad Religion", "Suicidal Tendencies", "Tenacious D", "The Offspring"], c: 0 },
        { id: 18, q: "Lagu 'M.I.A.' menceritakan tentang perang di negara mana?", a: ["Irak", "Vietnam", "Afganistan", "Suriah"], c: 0 },
        { id: 19, q: "Siapa personil yang mendesain logo 'Deathbat' asli saat masih SMA?", a: ["Micah Montague", "M. Shadows", "Zacky Vengeance", "The Rev"], c: 0 },
        { id: 20, q: "Teknik gitar 'Sweep Picking' di lagu 'Bat Country' terinspirasi dari komposer klasik siapa?", a: ["Paganini", "Bach", "Beethoven", "Vivaldi"], c: 0 },
        { id: 21, q: "Siapa produser yang menangani album 'Life Is But A Dream...'?", a: ["Joe Barresi", "Mike Elizondo", "Andy Wallace", "Rick Rubin"], c: 0 },
        { id: 22, q: "Lagu 'Acid Rain' merupakan bagian kedua (sekuel) dari lagu apa?", a: ["Planets", "Victim", "Coming Home", "Higher"], c: 0 },
        { id: 23, q: "Lirik lagu 'Fiction' diselesaikan oleh The Rev hanya berapa hari sebelum ia meninggal?", a: ["3 Hari", "1 Hari", "7 Hari", "14 Hari"], c: 0 },
        { id: 24, q: "Apa model gitar Schecter pertama yang digunakan Synyster Gates secara resmi?", a: ["Avenger", "Hellraiser", "C-1 Elite", "Tempest"], c: 0 },
        { id: 25, q: "DVD 'All Excess' merinci sejarah band. Apa kepanjangan dari nama asli M. Shadows?", a: ["Matthew Charles Sanders", "Matthew James Sanders", "Matthew Seth Sanders", "Matthew Robert Sanders"], c: 0 },
        { id: 26, q: "Lagu 'Warmness on the Soul' dirilis dalam format EP. Berapa jumlah lagu dalam EP tersebut?", a: ["4", "2", "6", "5"], c: 0 },
        { id: 27, q: "Siapa bassist A7X yang dipecat karena kabarnya menusuk ban mobil personil lain?", a: ["Justin Sane", "Dameon Ash", "Matt Wendt", "Johnny Christ"], c: 0 },
        { id: 28, q: "Zacky Vengeance menggunakan gitar kidal. Apa alasan utama ia memilih bermain kidal?", a: ["Secara alami kidal", "Tantangan", "Kagum pada Hendrix", "Cedera tangan kanan"], c: 0 },
        { id: 29, q: "Album 'The Stage' adalah 'concept album' yang membahas tentang?", a: ["Artificial Intelligence", "Simulated Reality", "Theology", "Semua Benar"], c: 3 },
        { id: 30, q: "Di lagu 'Beast and the Harlot', suara teriakan tinggi di awal lagu dilakukan oleh?", a: ["M. Shadows", "The Rev", "Synyster Gates", "Brian Haner Sr."], c: 1 },
        { id: 31, q: "Arin Ilejay adalah drummer termuda yang pernah bergabung. Band apa yang ia tinggalkan demi A7X?", a: ["Confide", "Attack Attack!", "Of Mice & Men", "The Word Alive"], c: 0 },
        { id: 32, q: "Lagu 'God Hates Us' terinspirasi dari gaya musik band metal legendaris apa?", a: ["Pantera", "Slayer", "Metallica", "Megadeth"], c: 0 },
        { id: 33, q: "Brian Haner Sr. (Papa Gates) mengisi solo gitar di lagu apa pada album City of Evil?", a: ["Sidewinder", "Bat Country", "Seize the Day", "M.I.A."], c: 0 },
        { id: 34, q: "Album 'Waking the Fallen' adalah album terakhir yang menggunakan vokal?", a: ["Full Screaming", "Clean Vokal", "Double Tracking", "Growl"], c: 0 },
        { id: 35, q: "Siapa model wanita yang menjadi 'kekasih' M. Shadows di video klip Seize the Day?", a: ["Valary DiBenedetto", "Michelle DiBenedetto", "Gwendolyn Sanders", "Lacey Christ"], c: 1 },
        { id: 36, q: "Berapa banyak lagu di album 'Nightmare' yang liriknya ditulis sepenuhnya oleh The Rev?", a: ["1 (Fiction)", "3", "0", "5"], c: 0 },
        { id: 37, q: "The Rev merekam bagian vokal untuk lagu 'A Little Piece of Heaven' di studio mana?", a: ["Bilik vokal sendiri", "Kamar mandi studio", "Garasi M. Shadows", "Hutan"], c: 1 },
        { id: 38, q: "Lagu 'Nightmare' awalnya akan diberi judul apa oleh The Rev?", a: ["Death", "The One", "L-7", "Buried Alive"], c: 1 },
        { id: 39, q: "Lagu 'The Fight' merupakan B-side dari album mana?", a: ["Self-Titled", "Nightmare", "City of Evil", "The Stage"], c: 0 },
        { id: 40, q: "Nama Avenged Sevenfold diambil dari Kejadian 4:24. Siapa tokoh di Alkitab yang dimaksud?", a: ["Kain", "Habel", "Adam", "Lamekh"], c: 0 },
        { id: 41, q: "Siapa pemain biola profesional yang mengisi di lagu 'Afterlife'?", a: ["Samuel Fischer", "Musisi Session (Tidak Dikreditkan)", "Brian Haner Sr", "The Rev"], c: 1 },
        { id: 42, q: "Lagu 'Dear God' memiliki pengaruh kuat dari genre Country. Siapa musisi country inspirasinya?", a: ["Johnny Cash", "Eagles", "Garth Brooks", "Blake Shelton"], c: 1 },
        { id: 43, q: "Apa nama band punk masa remaja Zacky Vengeance sebelum A7X?", a: ["MPA (Mad Porno Action)", "The Feds", "Society Trust", "Pinkly Smooth"], c: 0 },
        { id: 44, q: "Siapa bassist asli yang bermain di album 'Sounding the Seventh Trumpet'?", a: ["Justin Sane", "Matt Wendt", "Dameon Ash", "Johnny Christ"], c: 1 },
        { id: 45, q: "Lagu 'Nobody' menggunakan teknik 'Stop-Motion' untuk video klipnya. Berapa lama pembuatannya?", a: ["15 bulan", "5 bulan", "2 tahun", "8 bulan"], c: 0 },
        { id: 46, q: "Apa arti tato '7x' yang ada di belakang telinga para personil?", a: ["Tujuh kali lipat", "Anggota ke-7", "Tahun ke-7", "Kematian"], c: 0 },
        { id: 47, q: "Lagu 'Natural Born Killer' memiliki riff yang awalnya ditujukan untuk proyek?", a: ["Pinkly Smooth", "Solo Synyster Gates", "Film Horror", "Game Call of Duty"], c: 0 },
        { id: 48, q: "Lagu 'Cosmic' di album LIBAD sangat menonjolkan penggunaan alat musik?", a: ["Vocoder & Synthesizer", "Double Bass", "Terompet", "Harpa"], c: 0 },
        { id: 49, q: "Lagu 'Victim' dimulai dengan suara lonceng. Berapa kali lonceng tersebut berdentang?", a: ["12 kali", "7 kali", "10 kali", "13 kali"], c: 0 },
        { id: 50, q: "Siapa seniman yang mengerjakan artwork album 'Nightmare'?", a: ["Travis Smith", "Cam Rackam", "Wes Benscoter", "Micah Montague"], c: 0 }
    ];

    let user = { name: "", email: "" };
    let curIdx = 0;
    let score = 0;
    let timer;
    let timeLeft = 100;
    let activeQuestions = [];

    window.onload = fetchLeaderboard;

    function showView(id) {
        document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function checkDailyLimit() {
        const n = document.getElementById('username').value;
        const e = document.getElementById('useremail').value;
        if(!n || !e) return alert("Identify yourself!");
        
        const today = new Date().toLocaleDateString();
        if(localStorage.getItem(`a7x_daily_${e}`) === today) {
            return alert("Mission already completed today!");
        }

        // --- SISTEM ANTI-REPEAT SOAL ---
        let usedIds = JSON.parse(localStorage.getItem(`a7x_used_q_${e}`)) || [];
        
        // Filter soal yang belum pernah dikerjakan
        let available = database50.filter(q => !usedIds.includes(q.id));
        
        // Reset jika semua 50 soal sudah dikerjakan (siklus 5 hari selesai)
        if(available.length < 10) {
            alert("All mission packs completed! Resetting question cycle.");
            usedIds = [];
            available = [...database50];
        }

        user = { name: n, email: e };
        // Ambil 10 soal acak dari yang tersedia
        const shuffled = available.sort(() => Math.random() - 0.5);
        activeQuestions = shuffled.slice(0, 10);
        
        // Simpan ID soal yang akan dikerjakan ke list 'sudah dipakai'
        const currentIds = activeQuestions.map(q => q.id);
        localStorage.setItem(`a7x_used_q_${e}`, JSON.stringify([...usedIds, ...currentIds]));

        showView('view-quiz');
        loadQuestion();
    }

    function loadQuestion() {
        if(curIdx >= 10) return endQuiz();
        clearInterval(timer);
        timeLeft = 100;
        const data = activeQuestions[curIdx];
        document.getElementById('q-count').innerText = `QUEST ${curIdx + 1}/10`;
        document.getElementById('q-text').innerText = data.q;
        const box = document.getElementById('options-box');
        box.innerHTML = '';
        data.a.forEach((opt, i) => {
            const d = document.createElement('div');
            d.className = 'option-card';
            d.innerText = opt;
            d.onclick = () => handleAnswer(i);
            box.appendChild(d);
        });
        timer = setInterval(() => {
            timeLeft -= 1.1;
            document.getElementById('timer-bar').style.width = timeLeft + "%";
            if(timeLeft <= 0) handleAnswer(-1);
        }, 100);
    }

    function handleAnswer(idx) {
        if(idx === activeQuestions[curIdx].c) {
            score += 10;
            document.getElementById('q-score').innerText = `XP: ${score}`;
        }
        curIdx++;
        loadQuestion();
    }

    function endQuiz() {
        clearInterval(timer);
        showView('view-result');
        document.getElementById('final-points').innerText = score;
        localStorage.setItem(`a7x_daily_${user.email}`, new Date().toLocaleDateString());
        submitScore();
    }

    async function submitScore() {
        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ user: user.name, email: user.email, score: score })
            });
            document.getElementById('sync-status').innerText = "XP DATA SYNCHRONIZED";
            fetchLeaderboard();
        } catch(e) { console.log(e); }
    }

    async function fetchLeaderboard() {
        const target = document.getElementById('leaderboard-list');
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            data.sort((a,b) => b[2] - a[2]);
            target.innerHTML = data.slice(0, 10).map((row, i) => `
                <div class="leader-item">
                    <span><strong style="color:gold">#${i+1}</strong> ${row[0]}</span>
                    <span style="color:var(--neon-red); font-family:'Orbitron'; font-weight:bold;">${row[2]} XP</span>
                </div>
            `).join('');
        } catch(e) { target.innerHTML = "<p style='color:#333; text-align:center;'>Database Offline.</p>"; }
    }
</script>

</body>
</html>
