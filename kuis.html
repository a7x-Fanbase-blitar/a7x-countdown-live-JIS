<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A7X BLITAR | TRIVIA & LYRICS SYSTEM v4.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Metal+Mania&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-red: #ff0000;
            --dark-red: #660000;
            --panel-bg: rgba(5, 5, 5, 0.95);
            --border-glow: 1px solid rgba(255, 0, 0, 0.6);
            --gold: #ffcc00;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #030303;
            background-image: radial-gradient(circle, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.95) 100%), url('wood.jpg!d');
            background-size: cover;
            background-attachment: fixed;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }
        
        header { 
            padding: clamp(30px, 8vh, 60px) 20px 20px 20px; 
            text-align: center; 
            position: relative;
        }
        header::after {
            content: '';
            display: block;
            width: 150px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-red), transparent);
            margin: 15px auto 0 auto;
        }
        
        .glitch-text { 
            font-family: 'Orbitron', sans-serif; 
            font-size: clamp(2rem, 6vw, 4rem); 
            font-weight: 900; 
            letter-spacing: 3px;
            text-shadow: 0 0 15px var(--neon-red); 
            animation: shadow-glitch 1.5s infinite; 
            text-transform: uppercase; 
        }
        @keyframes shadow-glitch { 
            0% { text-shadow: 3px 3px var(--neon-red), -3px -3px #000; } 
            25% { text-shadow: -2px 3px #ff3333, 2px -3px #222; }
            50% { text-shadow: -3px -3px var(--neon-red), 3px 3px #444; } 
            75% { text-shadow: 2px -2px #ff3333, -2px 2px #111; }
            100% { text-shadow: 3px 3px var(--neon-red), -3px -3px #000; } 
        }
        
        .metal-subtitle { 
            font-family: 'Metal Mania', cursive; 
            color: #cccccc; 
            font-size: clamp(1.2rem, 3vw, 1.8rem); 
            letter-spacing: 4px; 
            margin-top: 5px; 
            text-transform: uppercase; 
            text-shadow: 0 0 8px #000;
        }
        
        /* CONTAINER RESPONSIF PC & HP */
        .main-container { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 20px; 
            width: 100%; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 15px 40px 15px;
            flex: 1;
        }
        
        .panel { 
            background: var(--panel-bg); 
            border: var(--border-glow); 
            border-radius: 12px; 
            padding: clamp(15px, 4vw, 30px); 
            backdrop-filter: blur(20px); 
            box-shadow: 0 0 30px rgba(255,0,0,0.15), inset 0 0 20px rgba(0,0,0,0.9); 
            height: fit-content; 
            width: 100%;
        }
        
        .panel-header { 
            font-family: 'Orbitron', sans-serif; 
            color: var(--neon-red); 
            font-size: clamp(1rem, 2vw, 1.2rem); 
            margin-bottom: 20px; 
            border-left: 5px solid var(--neon-red); 
            padding-left: 12px; 
            text-shadow: 0 0 5px rgba(255,0,0,0.5);
            letter-spacing: 1px;
        }
        
        .btn-metal { 
            width: 100%; 
            padding: 16px; 
            background: linear-gradient(135deg, var(--dark-red), #b30000); 
            color: #fff; 
            border: 1px solid var(--neon-red); 
            border-radius: 8px; 
            font-family: 'Orbitron', sans-serif; 
            font-weight: 900; 
            font-size: 0.9rem;
            cursor: not-allowed; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 12px;
        }
        .btn-metal:disabled { background: #111; border-color: #222; color: #444; box-shadow: none; }
        
        .btn-redeem { 
            display: block;
            width: 100%; 
            padding: 14px; 
            background: transparent; 
            border: 2px solid var(--gold); 
            color: var(--gold); 
            border-radius: 8px; 
            font-family: 'Orbitron', sans-serif; 
            font-weight: bold; 
            font-size: 0.85rem;
            text-align: center;
            text-decoration: none;
            text-transform: uppercase; 
            margin-top: 15px; 
            transition: 0.2s all ease; 
        }
        .btn-redeem:hover { 
            background: var(--gold); 
            color: black; 
            box-shadow: 0 0 20px var(--gold); 
        }
        
        .leader-item { 
            display: flex; 
            justify-content: space-between; 
            padding: 12px 14px; 
            background: rgba(255,255,255,0.02); 
            margin-bottom: 8px; 
            border-radius: 6px; 
            border: 1px solid rgba(255,255,255,0.05); 
            align-items: center; 
            font-size: 0.95rem;
        }
        
        /* ANIMASI RGB LEADERBOARD */
        @keyframes rgbWave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .rank-1-name {
            font-weight: 700;
            background: linear-gradient(90deg, #ff0000, #ff8000, #ffff00, #00ff00, #00ffff, #0000ff, #8000ff, #ff00ff, #ff0000);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rgbWave 5s linear infinite;
        }
        .rank-2-name {
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 45%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .rank-3-name { font-weight: 700; color: #cd7f32; }

        /* BOX TIMEOUT/COUNTDOWN AUTO-RESPONSIVE */
        .countdown-box {
            background: linear-gradient(180deg, #0a0a0a 0%, #030303 100%);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 12px;
            padding: clamp(15px, 4vw, 25px) 10px;
            text-align: center;
            margin-bottom: 20px;
        }
        .cd-msg {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            color: var(--neon-red);
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-shadow: 0 0 8px rgba(255,0,0,0.6);
            line-height: 1.4;
        }
        .timer-grid {
            display: flex;
            justify-content: center;
            gap: clamp(6px, 2vw, 15px);
        }
        .time-block {
            background: #000;
            border: 1px solid #1c1c1c;
            padding: 8px clamp(6px, 2vw, 15px);
            border-radius: 8px;
            flex: 1;
            max-width: 80px;
            min-width: 55px;
        }
        .time-num {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-weight: 700;
            color: #fff;
        }
        .time-label {
            font-size: clamp(0.55rem, 1.5vw, 0.65rem);
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        input { 
            width: 100%; 
            padding: 16px; 
            margin-bottom: 15px; 
            background: #050505; 
            border: 1px solid #222; 
            color: #444; 
            border-radius: 8px; 
            font-family: inherit; 
            font-size: 1rem; 
            text-align: center;
        }
        
        section { display: none; }
        section.active { display: block; }

        /* =======================================================
           MEDIA QUERY: LAYAR PC / TABLET HORIZONTAL (MIN 768px)
           ======================================================= */
        @media (min-width: 768px) {
            .main-container { 
                grid-template-columns: 1fr 1.5fr; /* Membagi dua panel kanan-kiri di PC */
                gap: 25px;
            }
            header {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>

<div id="toast"></div>

<header>
    <h1 class="glitch-text">A7X BLITAR</h1>
    <p class="metal-subtitle">Deathbat Nation Quiz</p>
</header>

<div class="main-container">
    <aside class="panel">
        <h3 class="panel-header">LEADERBOARD</h3>
        <div id="leaderboard-list"><p style="color:#444; text-align: center; font-family:'Orbitron'; font-size:0.85rem;">Fetching souls...</p></div>
        <div style="margin-top: 25px; border-top: 1px solid #222; padding-top: 20px;">
            <h3 class="panel-header" style="color: var(--gold); border-color: var(--gold); font-size: 0.9rem;">ELITE REWARDS</h3>
            <a href="redem.html" class="btn-redeem">REDEEM XP POINTS</a>
        </div>
    </aside>

    <main class="panel" id="main-panel">
        <section id="view-gate" class="active">
            <h3 class="panel-header">GATEKEEPER ACCESS</h3>
            
            <div class="countdown-box">
                <div class="cd-msg">⚠️ QUIZ SELESAI | COOLDOWN SYSTEM UPDATE</div>
                <div class="timer-grid">
                    <div class="time-block">
                        <div class="time-num" id="days">00</div>
                        <div class="time-label">Hari</div>
                    </div>
                    <div class="time-block">
                        <div class="time-num" id="hours">00</div>
                        <div class="time-label">Jam</div>
                    </div>
                    <div class="time-block">
                        <div class="time-num" id="minutes">00</div>
                        <div class="time-label">Menit</div>
                    </div>
                    <div class="time-block">
                        <div class="time-num" id="seconds">00</div>
                        <div class="time-label">Detik</div>
                    </div>
                </div>
            </div>

            <input type="text" placeholder="LOCKDOWN MODE - ENGINE OFFLINE" disabled>
            <button class="btn-metal" disabled>START QUIZ MISSION (LOCKED)</button>
            <button class="btn-metal btn-lyric" disabled style="margin-bottom:0;">START LYRICS MISSION (LOCKED)</button>
        </section>
    </main>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzvFAVo9rxkc9i_x86NR_TFSp_pG2ZIAUBCcUW5okBAa49Uq2dAb5pWbBwJW9mfnCRyfg/exec'; 

    let targetTime = localStorage.getItem('a7x_update_target');
    if (!targetTime) {
        targetTime = new Date().getTime() + (2 * 24 * 60 * 60 * 1000); 
        localStorage.setItem('a7x_update_target', targetTime);
    }

    function startCountdown() {
        const timerInterval = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetTime - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / (1000));

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');

            if (distance < 0) {
                clearInterval(timerInterval);
                document.querySelector(".countdown-box").innerHTML = "<div class='cd-msg' style='color:#00ff00; text-shadow:0 0 10px #00ff00;'>🔥 SYSTEM UPDATE READY! REFRESH PAGE...</div>";
                localStorage.removeItem('a7x_update_target'); 
            }
        }, 1000);
    }

    async function fetchLeaderboard() {
        const target = document.getElementById('leaderboard-list');
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            data.sort((a,b) => b[2] - a[2]);
            
            target.innerHTML = data.slice(0, 10).map((row, i) => {
                let nameStyleClass = "";
                let medalOverlay = "";

                if (i === 0) {
                    nameStyleClass = "class='rank-1-name'";
                    medalOverlay = "<span style='color:var(--gold); font-size:1.1rem; margin-right:5px;'>👑</span>";
                } else if (i === 1) {
                    nameStyleClass = "class='rank-2-name'";
                    medalOverlay = "<span style='color:#aaa; font-size:0.9rem; margin-right:5px;'>🥈</span>";
                } else if (i === 2) {
                    nameStyleClass = "class='rank-3-name'";
                    medalOverlay = "<span style='color:#cd7f32; font-size:0.9rem; margin-right:5px;'>🥉</span>";
                }

                return `
                    <div class="leader-item">
                        <span>
                            <strong style="color:#555; font-family:'Orbitron'; margin-right:5px;">#${i+1}</strong> 
                            ${medalOverlay}<span ${nameStyleClass}>${row[0]}</span>
                        </span>
                        <span style="color:var(--neon-red); font-family:'Orbitron'; font-weight:bold;">${row[2]} XP</span>
                    </div>
                `;
            }).join('');
        } catch(e) { target.innerHTML = "<p style='color:#333; text-align:center;'>Database Offline.</p>"; }
    }

    window.onload = function() {
        fetchLeaderboard();
        startCountdown();
    };
</script>

</body>
</html>
