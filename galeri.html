<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Deathbat Blitar Raya</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), url('a7x.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .a7x-title { font-family: 'Metal Mania', cursive; }

        .animate-gallery {
            display: inline-block;
            animation: glow-float 3s ease-in-out infinite;
        }

        @keyframes glow-float {
            0%, 100% { transform: translateY(0); text-shadow: 0 0 15px #ef4444; color: #dc2626; }
            50% { transform: translateY(-8px); text-shadow: 0 0 30px #ef4444; color: #ff4d4d; }
        }

        /* --- ANIMASI KELELAWAR --- */
        .bat-particle {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            filter: brightness(0) invert(1) drop-shadow(0 0 5px rgba(239, 68, 68, 0.5));
            animation: flyAround 10s linear infinite;
            opacity: 0;
        }

        @keyframes flyAround {
            0% { transform: translate(-10vw, 100vh) rotate(0deg) scale(0.5); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translate(110vw, -10vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        .ultra-glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        /* --- SWIPER ADAPTIF (FOTO TIDAK GEPENG) --- */
        .swiper { width: 100%; padding-top: 20px; padding-bottom: 60px; }

        .swiper-slide {
            width: 85vw; 
            max-width: 550px; 
            min-height: 350px; /* Mencegah kotak kolaps/gepeng saat loading */
            aspect-ratio: 4/3; /* Membuat proporsi rasio foto seimbang */
            border-radius: 15px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow: hidden;
            transition: transform 0.4s, border-color 0.4s, box-shadow 0.4s;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Border & Glow Menyala Mengikuti Lekuk Frame Foto yang Aktif */
        .swiper-slide-active {
            border: 2px solid #ef4444;
            box-shadow: 0 0 35px rgba(239, 68, 68, 0.6);
        }

        /* Mengatur Foto Tampil Penuh Utuh */
        .swiper-slide img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* Memastikan foto mengisi ruang tanpa gepeng */
            display: block;
        }

        .swiper-button-next, .swiper-button-prev { color: #ef4444 !important; }
        .swiper-pagination-bullet-active { background: #ef4444 !important; }
    </style>
</head>
<body class="flex flex-col items-center">

    <nav class="w-full p-4 md:p-5 flex justify-between items-center bg-black/60 backdrop-blur-xl border-b border-red-600/20 sticky top-0 z-[100]">
        <a href="index.html" class="flex items-center text-red-600 hover:text-white transition group text-[10px] md:text-sm font-bold tracking-widest">
            <i class="fas fa-chevron-left mr-2 group-hover:-translate-x-1 transition"></i> KEMBALI
        </a>
        <h1 class="a7x-title text-xl md:text-4xl tracking-widest animate-gallery">GALLERY</h1>
        <div class="w-12 md:w-16"></div> 
    </nav>

    <main class="w-full max-w-6xl px-4 py-8 text-center relative z-10">
        <header class="mb-10">
            <h2 class="text-xl md:text-4xl font-bold uppercase mb-2">Dokumentasi Fanbase</h2>
            <p class="text-gray-500 text-[8px] md:text-xs tracking-[0.4em] uppercase">Momen Kebersamaan Deathbat Blitar Raya</p>
        </header>

        <!-- --- CONTAINER SWIPER --- -->
        <div class="swiper mySwiper">
            <div class="swiper-wrapper" id="gallery-wrapper">
                <div class="swiper-slide flex items-center justify-center bg-black/40 p-10">
                    <p class="text-red-500 animate-pulse text-[10px] tracking-widest">MENGAMBIL DATA DARI DATABASE...</p>
                </div>
            </div>
            <div class="swiper-pagination"></div>
        </div>

        <div class="mt-12 ultra-glass p-6 inline-block mx-auto border-red-600/20 shadow-[0_0_20px_rgba(239,68,68,0.1)]">
            <p class="text-gray-400 text-[8px] md:text-[10px] uppercase tracking-widest mb-4">Punya foto dokumentasi terbaru?</p>
            <a href="index.html" class="bg-gradient-to-r from-red-800 to-red-600 hover:shadow-[0_0_25px_rgba(239,68,68,0.7)] px-6 py-3 rounded-full text-[10px] font-bold transition flex items-center gap-2 justify-center">
                UPLOAD FOTO DI SINI <i class="fas fa-upload"></i>
            </a>
        </div>
    </main>

    <footer class="mt-auto py-8 text-gray-600 text-[8px] md:text-[9px] uppercase tracking-[0.5em] text-center">
        &copy; DEATHBAT FAMILY - Blitar Raya Fanbase
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqThNRkYsIMseIJlGw7vMhn5WLj17K7c95bjcmabC0Ry2teO1iG6LSxUH9Jhu0Wk6DXw/exec";
        
        let allImagesData = []; 
        let swiperInstance = null; 
        
        // --- SPAWN BATS (ANIMASI KELELAWAR) ---
        function spawnBats() {
            const batCount = 6;
            for(let i=0; i<batCount; i++) {
                setTimeout(() => {
                    const bat = document.createElement('img');
                    bat.src = 'https://www.pngarts.com/files/1/Bat-PNG-Transparent-Image.png';
                    bat.className = 'bat-particle';
                    bat.style.width = Math.random() * 40 + 20 + 'px';
                    bat.style.left = Math.random() * 100 + 'vw';
                    bat.style.animationDuration = Math.random() * 5 + 7 + 's';
                    bat.style.animationDelay = Math.random() * 5 + 's';
                    document.body.appendChild(bat);
                }, i * 2500);
            }
        }

        // --- FETCH UTAMA DARI GOOGLE SHEETS ---
        async function loadImages() {
            const wrapper = document.getElementById('gallery-wrapper');
            try {
                // Memanggil data Gallery dari Apps Script
                const res = await fetch(`${APPS_SCRIPT_URL}?action=get_gallery`);
                const files = await res.json();

                if (files.length === 0) {
                    wrapper.innerHTML = '<p class="w-full text-center text-gray-500 uppercase tracking-widest text-[10px]">BELUM ADA FOTO YANG DIUPLOAD PASUKAN.</p>';
                    return;
                }

                allImagesData = files.map(file => {
                    let directUrl = file.url;
                    
                    // Ambil ID Drive dengan Regex untuk ditampilkan sebagai Thumbnail HD
                    const driveIdMatch = file.url.match(/[-\w]{25,}/);
                    if (driveIdMatch && driveIdMatch[0]) {
                        directUrl = `https://drive.google.com/thumbnail?id=${driveIdMatch[0]}&sz=w1000`;
                    }

                    return { 
                        cdn: directUrl, 
                        name: file.nama,
                        waktu: file.waktu
                    };
                });

                renderGallery();
                spawnBats();
            } catch (e) {
                console.error(e);
                wrapper.innerHTML = '<p class="text-red-500 text-[10px] tracking-widest uppercase">KONEKSI DATABASE BERMASALAH.</p>';
            }
        }

        // --- RENDER ELEMEN GAMBAR KE SWIPER WRAPPER ---
        function renderGallery() {
            const wrapper = document.getElementById('gallery-wrapper');
            
            if (swiperInstance) {
                swiperInstance.destroy(true, true);
                swiperInstance = null;
            }

            wrapper.innerHTML = '';

            allImagesData.forEach(img => {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                slide.innerHTML = `
                    <img src="${img.cdn}" alt="Foto oleh ${img.name}" loading="lazy">
                    <div class="absolute bottom-0 left-0 w-full p-3 md:p-4 bg-gradient-to-t from-black via-black/80 to-transparent text-left">
                        <p class="text-white text-[9px] md:text-[11px] font-bold uppercase tracking-widest truncate">Upload by: ${img.name}</p>
                        <p class="text-red-500 text-[7px] md:text-[8px] font-black uppercase">Waktu: ${img.waktu} • Deathbat Blitar Raya</p>
                    </div>
                `;
                wrapper.appendChild(slide);
            });

            initSwiper();
        }

        // --- INISIALISASI SWIPER ---
        function initSwiper() {
            swiperInstance = new Swiper(".mySwiper", {
                effect: "coverflow",
                grabCursor: true,
                centeredSlides: true,
                slidesPerView: "auto",
                loop: document.querySelectorAll('#gallery-wrapper .swiper-slide').length > 1,
                coverflowEffect: {
                    rotate: 15,
                    stretch: 0,
                    depth: 100,
                    modifier: 2.5,
                    slideShadows: true,
                },
                autoplay: { delay: 3500, disableOnInteraction: false },
                pagination: { el: ".swiper-pagination", clickable: true },
            });
        }

        window.onload = loadImages;
    </script>
</body>
</html>
