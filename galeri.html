<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Deathbat Blitar Raya</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), url('a7x.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .a7x-title { font-family: 'Metal Mania', cursive; }

        .animate-gallery {
            display: inline-block;
            animation: glow-float 3s ease-in-out infinite;
        }

        @keyframes glow-float {
            0%, 100% { transform: translateY(0); text-shadow: 0 0 15px #ff0000; color: #dc2626; }
            50% { transform: translateY(-8px); text-shadow: 0 0 30px #ff0000; color: #ff4d4d; }
        }

        /* --- ANIMASI KELELAWAR --- */
        .bat-particle {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            filter: brightness(0) invert(1) drop-shadow(0 0 5px rgba(255,0,0,0.5));
            animation: flyAround 10s linear infinite;
            opacity: 0;
        }

        @keyframes flyAround {
            0% { transform: translate(-10vw, 100vh) rotate(0deg) scale(0.5); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translate(110vw, -10vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        .ultra-glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        /* --- SWIPER ADAPTIF (BORDER MENYESUAIKAN FOTO FULL) --- */
        .swiper { width: 100%; padding-top: 20px; padding-bottom: 60px; }

        .swiper-slide {
            width: 85vw; /* Lebar responsif di HP */
            max-width: 550px; /* Batas lebar maksimal di desktop */
            height: auto; /* Mengikuti tinggi foto asli secara proporsional */
            border-radius: 15px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow: hidden;
            transition: transform 0.4s, border-color 0.4s, box-shadow 0.4s;
            background: rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Border & Glow Menyala Mengikuti Lekuk Frame Foto yang Aktif */
        .swiper-slide-active {
            border: 2px solid #ef4444;
            box-shadow: 0 0 35px rgba(239, 68, 68, 0.6);
        }

        /* Mengatur Foto Tampil Penuh Utuh */
        .swiper-slide img { 
            width: 100%; 
            height: auto; 
            object-fit: contain; /* Foto utuh tidak terpotong */
            display: block;
        }

        .swiper-button-next, .swiper-button-prev { color: #ef4444 !important; }
        .swiper-pagination-bullet-active { background: #ef4444 !important; }

        /* Style tombol kategori aktif */
        .tab-btn.active {
            background-color: #dc2626;
            color: #fff;
            border-color: #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
        }
    </style>
</head>
<body class="flex flex-col items-center">

    <nav class="w-full p-4 md:p-5 flex justify-between items-center bg-black/60 backdrop-blur-xl border-b border-white/10 sticky top-0 z-[100]">
        <a href="index.html" class="flex items-center text-red-500 hover:text-white transition group text-[10px] md:text-sm font-bold tracking-widest">
            <i class="fas fa-chevron-left mr-2 group-hover:-translate-x-1 transition"></i> KEMBALI
        </a>
        <h1 class="a7x-title text-xl md:text-4xl tracking-widest animate-gallery">GALLERY</h1>
        <div class="w-12 md:w-16"></div> 
    </nav>

    <main class="w-full max-w-6xl px-4 py-8 text-center relative z-10">
        <header class="mb-6">
            <h2 class="text-xl md:text-4xl font-bold uppercase mb-2">Dokumentasi Fanbase</h2>
            <p class="text-gray-500 text-[8px] md:text-xs tracking-[0.4em] uppercase">Momen Kebersamaan Deathbat Blitar Raya</p>
        </header>

        <!-- --- FILTER KATEGORI (TABS) --- -->
        <div class="flex flex-wrap justify-center gap-2 md:gap-4 mb-8 max-w-xl mx-auto px-2">
            <button onclick="filterCategory('all')" id="tab-all" class="tab-btn active bg-white/5 border border-white/10 px-4 py-1.5 md:px-6 md:py-2 rounded-full text-[9px] md:text-xs font-bold tracking-widest uppercase transition-all duration-300 hover:bg-red-600/30">
                <i class="fas fa-th-large mr-1.5"></i> Semua
            </button>
            <button onclick="filterCategory('konser')" id="tab-konser" class="tab-btn bg-white/5 border border-white/10 px-4 py-1.5 md:px-6 md:py-2 rounded-full text-[9px] md:text-xs font-bold tracking-widest uppercase transition-all duration-300 hover:bg-red-600/30">
                <i class="fas fa-guitar mr-1.5"></i> Konser
            </button>
            <button onclick="filterCategory('kopdar')" id="tab-kopdar" class="tab-btn bg-white/5 border border-white/10 px-4 py-1.5 md:px-6 md:py-2 rounded-full text-[9px] md:text-xs font-bold tracking-widest uppercase transition-all duration-300 hover:bg-red-600/30">
                <i class="fas fa-users mr-1.5"></i> Kopdar
            </button>
            <button onclick="filterCategory('random')" id="tab-random" class="tab-btn bg-white/5 border border-white/10 px-4 py-1.5 md:px-6 md:py-2 rounded-full text-[9px] md:text-xs font-bold tracking-widest uppercase transition-all duration-300 hover:bg-red-600/30">
                <i class="fas fa-bolt mr-1.5"></i> Random
            </button>
        </div>

        <!-- --- CONTAINER SWIPER --- -->
        <div class="swiper mySwiper">
            <div class="swiper-wrapper" id="gallery-wrapper">
                <div class="swiper-slide flex items-center justify-center bg-black/40 p-10">
                    <p class="text-red-500 animate-pulse text-[10px]">MENGAMBIL DATA DARI CLOUD...</p>
                </div>
            </div>
            <div class="swiper-pagination"></div>
        </div>

        <div class="mt-8 ultra-glass p-6 inline-block mx-auto">
            <p class="text-gray-400 text-[8px] md:text-[10px] uppercase tracking-widest mb-4">Punya foto dokumentasi?</p>
            <a href="https://wa.me/6287753855074" class="bg-red-600/20 hover:bg-red-600 border border-red-600/50 px-6 py-2 rounded-full text-[10px] font-bold transition flex items-center gap-2">
                KIRIM FOTO <i class="fas fa-paper-plane"></i>
            </a>
        </div>
    </main>

    <footer class="mt-auto py-8 text-gray-600 text-[8px] md:text-[9px] uppercase tracking-[0.5em] text-center">
        &copy; DEATHBAT FAMILY - Blitar Raya Fanbase
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const REPO = "a7x-Fanbase-blitar/image";
        let allImagesData = []; 
        let swiperInstance = null; 
        
        // --- SPAWN BATS (ANIMASI KELELAWAR) ---
        function spawnBats() {
            const batCount = 6;
            for(let i=0; i<batCount; i++) {
                setTimeout(() => {
                    const bat = document.createElement('img');
                    bat.src = 'https://www.pngarts.com/files/1/Bat-PNG-Transparent-Image.png';
                    bat.className = 'bat-particle';
                    bat.style.width = Math.random() * 40 + 20 + 'px';
                    bat.style.left = Math.random() * 100 + 'vw';
                    bat.style.animationDuration = Math.random() * 5 + 7 + 's';
                    bat.style.animationDelay = Math.random() * 5 + 's';
                    document.body.appendChild(bat);
                }, i * 2500);
            }
        }

        // --- FETCH UTAMA DARI GITHUB ---
        async function loadImages() {
            const wrapper = document.getElementById('gallery-wrapper');
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO}/contents/?ref=main`);
                const files = await res.json();
                
                const images = files.filter(f => f.name.match(/\.(jpg|jpeg|png|webp)$/i));

                if (images.length === 0) {
                    wrapper.innerHTML = '<p class="w-full text-center text-gray-500">BELUM ADA FOTO DI REPO.</p>';
                    return;
                }

                allImagesData = images.map(img => {
                    const rawName = img.name.split('.')[0]; 
                    
                    let category = 'random'; 
                    const match = rawName.match(/\(([^)]+)\)$/); 
                    
                    if (match) {
                        const tag = match[1].toLowerCase();
                        if (tag === 'konser' || tag === 'kopdar' || tag === 'random') {
                            category = tag;
                        }
                    }

                    const cleanName = rawName.replace(/\(([^)]+)\)$/, '').replace(/_/g, ' ').trim();
                    const cdn = `https://cdn.jsdelivr.net/gh/${REPO}@main/${img.path}`;

                    return { cdn, name: cleanName, category };
                });

                renderGallery('all');
                spawnBats();
            } catch (e) {
                wrapper.innerHTML = '<p class="text-red-500">KONEKSI BERMASALAH.</p>';
            }
        }

        // --- RENDER ELEMEN GAMBAR KE SWIPER WRAPPER ---
        function renderGallery(categoryFilter) {
            const wrapper = document.getElementById('gallery-wrapper');
            
            if (swiperInstance) {
                swiperInstance.destroy(true, true);
                swiperInstance = null;
            }

            wrapper.innerHTML = '';

            const filtered = categoryFilter === 'all' 
                ? allImagesData 
                : allImagesData.filter(img => img.category === categoryFilter);

            if (filtered.length === 0) {
                wrapper.innerHTML = `<p class="w-full text-center text-gray-500 py-10 uppercase tracking-widest text-[10px]">Tidak ada foto di kategori ini.</p>`;
                return;
            }

            filtered.forEach(img => {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                slide.innerHTML = `
                    <img src="${img.cdn}" alt="${img.name}">
                    <div class="absolute bottom-0 left-0 w-full p-3 md:p-4 bg-gradient-to-t from-black via-black/80 to-transparent text-left">
                        <p class="text-white text-[9px] md:text-[11px] font-bold uppercase tracking-widest">${img.name}</p>
                        <p class="text-red-500 text-[7px] md:text-[8px] font-black uppercase">Deathbat Blitar Raya • ${img.category}</p>
                    </div>
                `;
                wrapper.appendChild(slide);
            });

            initSwiper();
        }

        // --- FILTER KATEGORI VIA TOMBOL ---
        function filterCategory(category) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${category}`).classList.add('active');
            renderGallery(category);
        }

        // --- INISIALISASI SWIPER ---
        function initSwiper() {
            swiperInstance = new Swiper(".mySwiper", {
                effect: "coverflow",
                grabCursor: true,
                centeredSlides: true,
                slidesPerView: "auto",
                loop: document.querySelectorAll('#gallery-wrapper .swiper-slide').length > 1,
                coverflowEffect: {
                    rotate: 15,
                    stretch: 0,
                    depth: 100,
                    modifier: 2.5,
                    slideShadows: true,
                },
                autoplay: { delay: 3500, disableOnInteraction: false },
                pagination: { el: ".swiper-pagination", clickable: true },
            });
        }

        window.onload = loadImages;
    </script>
</body>
</html>
